<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Comandero</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0f0f0f; --surface: #1a1a1a; --border: #2a2a2a;
    --accent: #e8ff5a; --text: #f0f0f0; --muted: #555;
    --mono: 'DM Mono', monospace; --sans: 'DM Sans', sans-serif;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--bg); color: var(--text); font-family: var(--sans);
    min-height: 100vh; display: flex; flex-direction: column;
    align-items: center; justify-content: center; padding: 2rem;
  }
  .logo { font-family: var(--mono); font-size: 13px; color: var(--muted); letter-spacing: .1em; text-transform: uppercase; margin-bottom: 2rem; }
  h1 { font-family: var(--mono); font-size: 42px; font-weight: 500; color: var(--accent); letter-spacing: -2px; margin-bottom: .5rem; }
  .sub { font-size: 15px; color: var(--muted); margin-bottom: 3rem; }
  .grid {
    display: grid; grid-template-columns: repeat(auto-fit, minmax(200px,1fr));
    gap: 12px; width: 100%; max-width: 700px;
  }
  .card {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 14px; padding: 1.5rem; text-decoration: none;
    color: var(--text); transition: border-color .15s, background .15s;
    display: flex; flex-direction: column; gap: 8px;
  }
  .card:hover { border-color: var(--accent); background: #1e1e1e; }
  .card-icon {
    width: 36px; height: 36px; border-radius: 8px;
    display: flex; align-items: center; justify-content: center;
    font-size: 18px; margin-bottom: 4px;
  }
  .card-title { font-family: var(--mono); font-size: 15px; font-weight: 500; }
  .card-desc { font-size: 13px; color: var(--muted); line-height: 1.5; }
  .ic-admin  { background: rgba(232,255,90,.12); }
  .ic-cam    { background: rgba(255,255,255,.06); }
  .ic-barra  { background: rgba(255,180,90,.1); }
  .ic-cocina { background: rgba(90,240,255,.1); }
  footer { margin-top: 3rem; font-family: var(--mono); font-size: 11px; color: var(--muted); }
</style>
</head>
<body>
<div class="logo">sistema de comandas</div>
<h1>comandero</h1>
<p class="sub">Selecciona tu puesto</p>

<div class="grid">
  <a class="card" href="admin.html">
    <div class="card-icon ic-admin">⚙</div>
    <div class="card-title">Admin</div>
    <div class="card-desc">Gestión de mesas, carta y configuración</div>
  </a>
  <a class="card" href="camarero.html">
    <div class="card-icon ic-cam">📋</div>
    <div class="card-title">Camarero</div>
    <div class="card-desc">Tomar comandas y generar tickets</div>
  </a>
  <a class="card" href="barra.html">
    <div class="card-icon ic-barra">🍺</div>
    <div class="card-title">Barra</div>
    <div class="card-desc">Pedidos de barra en tiempo real</div>
  </a>
  <a class="card" href="cocina.html">
    <div class="card-icon ic-cocina">🍳</div>
    <div class="card-title">Cocina</div>
    <div class="card-desc">Pedidos de cocina en tiempo real</div>
  </a>
</div>

<footer>v1.0 · GitHub Pages + Firebase Realtime DB</footer>
</body>
</html>
