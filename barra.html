<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title id="page-title">Barra · Comandero</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --accent: #e8ff5a; --accent-dim: rgba(232,255,90,0.13); --accent-text: #1a1a1a;
    --bg: #111; --surface: #1a1a1a; --surface2: #232323; --border: #2c2c2c;
    --text: #f0f0f0; --muted: #555; --sans: 'DM Sans', sans-serif; --mono: 'DM Mono', monospace;
  }
  .rol-cocina { --accent: #5af0ff; --accent-dim: rgba(90,240,255,0.12); --accent-text: #001f24; }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  body { background: var(--bg); color: var(--text); font-family: var(--sans); min-height: 100vh; }

  .topbar {
    background: var(--surface); border-bottom: 1px solid var(--border);
    padding: 0 1rem; height: 54px; display: flex; align-items: center; gap: 12px;
    position: sticky; top: 0; z-index: 20;
  }
  .topbar-title { font-family: var(--mono); font-size: 17px; color: var(--accent); }
  .spacer { flex: 1; }
  .badge-nuevos {
    background: var(--accent-dim); color: var(--accent);
    font-family: var(--mono); font-size: 12px; padding: 4px 12px;
    border-radius: 20px; border: 1px solid var(--accent); display: none;
  }
  .clock { font-family: var(--mono); font-size: 13px; color: var(--muted); }

  /* Toggle impresión */
  .print-toggle {
    display: flex; align-items: center; gap: 8px;
    font-family: var(--mono); font-size: 12px; color: var(--muted); cursor: pointer;
  }
  .toggle-track {
    width: 36px; height: 20px; border-radius: 10px; background: var(--border);
    position: relative; transition: background .2s; flex-shrink: 0;
  }
  .toggle-track.on { background: var(--accent); }
  .toggle-thumb {
    width: 16px; height: 16px; border-radius: 50%; background: #fff;
    position: absolute; top: 2px; left: 2px; transition: left .2s;
  }
  .toggle-track.on .toggle-thumb { left: 18px; }

  @keyframes flash-bg { 0%,100%{background:var(--bg)} 50%{background:var(--accent-dim)} }
  @keyframes pulse-dot { 0%,100%{opacity:1;transform:scale(1)} 50%{opacity:.3;transform:scale(.7)} }
  body.hay-nuevos { animation: flash-bg 1.4s ease-in-out infinite; }

  .pedidos-grid {
    padding: 1rem;
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
    gap: 12px;
    align-items: start;
  }
  .empty-state { display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 50vh; gap: 12px; color: var(--muted); }
  .empty-icon { width: 56px; height: 56px; border: 2px solid var(--border); border-radius: 12px; display: flex; align-items: center; justify-content: center; font-size: 24px; }
  .empty-text { font-family: var(--mono); font-size: 14px; }

  .mesa-card {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 14px; overflow: hidden; transition: border-color .3s;
  }
  .mesa-card.nueva { border-color: var(--accent); animation: flash-bg 1.4s ease-in-out infinite; }

  .card-header {
    display: flex; align-items: center; gap: 8px;
    padding: 10px 14px; background: var(--surface2);
    border-bottom: 1px solid var(--border); cursor: pointer;
  }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--accent); flex-shrink: 0; animation: pulse-dot 1s ease-in-out infinite; display: none; }
  .mesa-card.nueva .dot { display: block; }
  .card-mesa-name { font-family: var(--mono); font-size: 14px; font-weight: 500; color: var(--accent); flex: 1; }
  .card-time { font-family: var(--mono); font-size: 11px; color: var(--muted); }
  .btn-imprimir {
    background: none; border: 1px solid var(--border); border-radius: 6px;
    color: var(--muted); font-size: 14px; padding: 3px 7px; cursor: pointer;
    transition: border-color .15s, color .15s; flex-shrink: 0;
  }
  .btn-imprimir:active { border-color: var(--accent); color: var(--accent); }

  /* Línea de pedido */
  .linea-row {
    padding: 10px 14px; border-bottom: 1px solid var(--border);
    transition: opacity .25s;
  }
  .linea-row:last-child { border-bottom: none; }
  .linea-row.servida { opacity: .35; }

  .linea-main { display: flex; align-items: center; gap: 8px; }
  .linea-qty { font-family: var(--mono); font-size: 16px; font-weight: 500; min-width: 24px; color: var(--accent); }
  .linea-row.servida .linea-qty { color: var(--muted); }
  .linea-nombre { flex: 1; font-size: 15px; }

  /* Nota visible bajo el nombre */
  .linea-nota {
    margin-top: 4px; margin-left: 32px;
    font-size: 12px; color: var(--accent); font-family: var(--mono);
    background: var(--accent-dim); border-left: 2px solid var(--accent);
    padding: 3px 8px; border-radius: 0 4px 4px 0;
    display: inline-block;
  }
  .linea-row.servida .linea-nota { color: var(--muted); background: transparent; border-color: var(--border); }

  .btn-servido {
    font-family: var(--mono); font-size: 12px; padding: 6px 12px;
    border-radius: 8px; border: 1px solid var(--border);
    background: var(--surface2); color: var(--muted);
    cursor: pointer; white-space: nowrap; transition: all .15s; flex-shrink: 0;
  }
  .btn-servido:active { background: var(--border); }
  .btn-servido.hecho { border-color: rgba(90,255,154,.25); color: #5aff9a; background: rgba(90,255,154,.08); cursor: default; }
  .btn-stock {
    font-family: var(--mono); font-size: 14px; padding: 5px 10px;
    border-radius: 8px; border: 1px solid rgba(255,90,90,.3);
    background: rgba(255,90,90,.08); color: #ff5a5a;
    cursor: pointer; flex-shrink: 0; transition: all .15s;
  }
  .btn-stock:active { background: rgba(255,90,90,.2); }

  /* Wake lock toggle */
  .wake-toggle {
    display: flex; align-items: center; gap: 6px; cursor: pointer;
    font-family: var(--mono); font-size: 11px; color: var(--muted);
  }
  .wake-track {
    width: 32px; height: 18px; border-radius: 9px; background: var(--border);
    position: relative; transition: background .2s; flex-shrink: 0;
  }
  .wake-track.on { background: var(--accent); }
  .wake-thumb {
    width: 14px; height: 14px; border-radius: 50%; background: #fff;
    position: absolute; top: 2px; left: 2px; transition: left .2s;
  }
  .wake-track.on .wake-thumb { left: 16px; }

  /* ── PIN SCREEN ── */
  #pin-screen {
    position:fixed;inset:0;background:#111;z-index:200;
    display:flex;align-items:center;justify-content:center;
  }
  .pin-box {
    background:var(--surface);border:1px solid var(--border);
    border-radius:16px;padding:2rem 1.5rem;width:280px;
    display:flex;flex-direction:column;align-items:center;gap:1.25rem;
  }
  .pin-title{font-family:var(--mono);font-size:15px;font-weight:500;color:var(--accent)}
  .pin-sub{font-size:13px;color:var(--muted);text-align:center;margin-top:-.5rem}
  .pin-dots{display:flex;gap:10px}
  .pin-dot{width:14px;height:14px;border-radius:50%;border:2px solid var(--border);background:transparent;transition:background .15s,border-color .15s}
  .pin-dot.filled{background:var(--accent);border-color:var(--accent)}
  .pin-dot.error{background:#ff5a5a;border-color:#ff5a5a}
  .pin-pad{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;width:100%}
  .pin-key{height:52px;border-radius:10px;border:1px solid var(--border);background:var(--surface2);font-family:var(--mono);font-size:18px;font-weight:500;color:var(--text);cursor:pointer;transition:background .1s,transform .1s;display:flex;align-items:center;justify-content:center}
  .pin-key:active{background:var(--border);transform:scale(.95)}
  .pin-key.del{font-size:14px;color:var(--muted)}
  .pin-key.empty{border:none;background:none;cursor:default}
  .pin-error-msg{font-family:var(--mono);font-size:12px;color:#ff5a5a;display:none}
</style>
</head>
<body>

<div id="pin-screen">
  <div class="pin-box">
    <div class="pin-title" id="pin-rol-title">Barra</div>
    <div class="pin-sub">Introduce el PIN para acceder</div>
    <div class="pin-dots">
      <div class="pin-dot" id="pd0"></div><div class="pin-dot" id="pd1"></div>
      <div class="pin-dot" id="pd2"></div><div class="pin-dot" id="pd3"></div>
    </div>
    <div class="pin-error-msg" id="pin-error">PIN incorrecto</div>
    <div class="pin-pad">
      <button class="pin-key" onclick="pinKey('1')">1</button>
      <button class="pin-key" onclick="pinKey('2')">2</button>
      <button class="pin-key" onclick="pinKey('3')">3</button>
      <button class="pin-key" onclick="pinKey('4')">4</button>
      <button class="pin-key" onclick="pinKey('5')">5</button>
      <button class="pin-key" onclick="pinKey('6')">6</button>
      <button class="pin-key" onclick="pinKey('7')">7</button>
      <button class="pin-key" onclick="pinKey('8')">8</button>
      <button class="pin-key" onclick="pinKey('9')">9</button>
      <button class="pin-key empty"></button>
      <button class="pin-key" onclick="pinKey('0')">0</button>
      <button class="pin-key del" onclick="pinDel()">⌫</button>
    </div>
  </div>
</div>

<div class="topbar">
  <span class="topbar-title" id="topbar-title">Barra</span>
  <div class="spacer"></div>
  <label class="wake-toggle" title="Pantalla siempre encendida">
    <div class="wake-track" id="wake-track"><div class="wake-thumb"></div></div>
    <span>☀</span>
  </label>
  <label class="print-toggle" title="Imprimir automáticamente al llegar un pedido">
    <div class="toggle-track" id="print-track"><div class="toggle-thumb"></div></div>
    <span>🖨</span>
  </label>
  <label class="print-toggle" title="Generar TXT para autoimpresión sin diálogo">
    <div class="toggle-track" id="txt-track"><div class="toggle-thumb"></div></div>
    <span>TXT</span>
  </label>
  <span class="badge-nuevos" id="badge-nuevos"></span>
  <span class="clock" id="clock"></span>
</div>

<div id="pedidos-container">
  <div class="empty-state" id="empty-state">
    <div class="empty-icon">—</div>
    <span class="empty-text">Sin pedidos pendientes</span>
  </div>
  <div class="pedidos-grid" id="pedidos-grid" style="display:none"></div>
</div>

<script type="module">
import { db } from './firebase.js';
import { ref, onValue, set, get } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";

const escocina = location.pathname.includes('cocina') || location.search.includes('rol=cocina');
const ROL = escocina ? 'cocina' : 'barra';
const PRINT_KEY = 'autoimp_' + ROL;
const PIN_SESSION = 'auth_' + ROL;
let PIN_CORRECTO = '1234';

get(ref(db, 'config/pins/' + ROL)).then(s => { if (s.val()) PIN_CORRECTO = s.val(); }).catch(()=>{});

// ── PIN ───────────────────────────────────────────────────────────────────────
let pinBuffer = '';
if (sessionStorage.getItem(PIN_SESSION) === '1') {
  document.getElementById('pin-screen').style.display = 'none';
}
if (ROL === 'cocina') {
  const t = document.getElementById('pin-rol-title');
  if (t) t.textContent = 'Cocina';
}
window.pinKey = d => {
  if (pinBuffer.length >= 4) return;
  pinBuffer += d;
  updatePinDots();
  if (pinBuffer.length === 4) verificarPin();
};
window.pinDel = () => {
  pinBuffer = pinBuffer.slice(0,-1);
  updatePinDots(false);
  document.getElementById('pin-error').style.display = 'none';
};
function updatePinDots(error) {
  for (let i=0;i<4;i++) {
    const d = document.getElementById('pd'+i);
    if(d) d.className='pin-dot'+(i<pinBuffer.length?(error?' error':' filled'):'');
  }
}
function verificarPin() {
  if (pinBuffer === PIN_CORRECTO) {
    sessionStorage.setItem(PIN_SESSION, '1');
    document.getElementById('pin-screen').style.display = 'none';
  } else {
    updatePinDots(true);
    document.getElementById('pin-error').style.display = 'block';
    setTimeout(() => { pinBuffer=''; updatePinDots(false); document.getElementById('pin-error').style.display='none'; }, 900);
  }
}
// ─────────────────────────────────────────────────────────────────────────────

// ── Wake Lock ──────────────────────────────────────────────────────────────────
const WAKE_KEY2 = 'wake_' + ROL;
let wakeLock2 = null;
let autoWake2 = localStorage.getItem(WAKE_KEY2) === 'true';
const wakeTrack2 = document.getElementById('wake-track');
if (wakeTrack2) wakeTrack2.classList.toggle('on', autoWake2);
async function activarWake2() {
  try { if ('wakeLock' in navigator) wakeLock2 = await navigator.wakeLock.request('screen'); } catch(e) {}
}
if (autoWake2) activarWake2();
if (wakeTrack2) wakeTrack2.parentElement.addEventListener('click', () => {
  autoWake2 = !autoWake2;
  localStorage.setItem(WAKE_KEY2, autoWake2);
  wakeTrack2.classList.toggle('on', autoWake2);
  if (autoWake2) activarWake2(); else { if (wakeLock2) { wakeLock2.release(); wakeLock2 = null; } }
});
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible' && autoWake2) activarWake2();
});

if (ROL === 'cocina') {
  document.documentElement.classList.add('rol-cocina');
  document.getElementById('topbar-title').textContent = 'Cocina';
  document.title = 'Cocina · Comandero';
}

// ── Toggle impresión automática ───────────────────────────────────────────────
let autoImprimir = localStorage.getItem(PRINT_KEY) === 'true';
const printTrack = document.getElementById('print-track');

function updateToggleUI() {
  printTrack.classList.toggle('on', autoImprimir);
}
updateToggleUI();

printTrack.parentElement.addEventListener('click', () => {
  autoImprimir = !autoImprimir;
  localStorage.setItem(PRINT_KEY, autoImprimir);
  updateToggleUI();
});

// ── Toggle TXT ────────────────────────────────────────────────────────────────
const TXT_KEY = 'txt_' + ROL;
let autoTXT = localStorage.getItem(TXT_KEY) === 'true';
const txtTrack = document.getElementById('txt-track');
if (txtTrack) txtTrack.classList.toggle('on', autoTXT);
if (txtTrack) txtTrack.parentElement.addEventListener('click', () => {
  autoTXT = !autoTXT;
  localStorage.setItem(TXT_KEY, autoTXT);
  txtTrack.classList.toggle('on', autoTXT);
});

function generarTXT(mesaNombre, lineas) {
  const ahora = new Date();
  const hora  = ahora.toLocaleTimeString('es-ES', {hour:'2-digit', minute:'2-digit'});
  const fecha = ahora.toLocaleDateString('es-ES');
  const ts    = `${String(ahora.getHours()).padStart(2,'0')}${String(ahora.getMinutes()).padStart(2,'0')}${String(ahora.getSeconds()).padStart(2,'0')}`;
  const sep   = '--------------------------------';
  let txt = `${ROL==='cocina'?'COCINA':'BARRA'} — Mesa ${mesaNombre}\n${fecha}  ${hora}\n${sep}\n`;
  lineas.forEach(l => {
    const precio = (l.precio*l.qty).toFixed(2)+'EUR';
    const izq    = `${l.qty}x ${l.nombre}`;
    txt += izq+' '.repeat(Math.max(1,32-izq.length-precio.length))+precio+'\n';
    if (l.nota) txt += `   -> ${l.nota}\n`;
  });
  txt += sep+'\n';
  const blob = new Blob([txt],{type:'text/plain;charset=utf-8'});
  const url  = URL.createObjectURL(blob);
  const a    = document.createElement('a');
  a.href=url; a.download=`comanda-${ROL}-mesa${mesaNombre}-${ts}.txt`;
  document.body.appendChild(a); a.click();
  document.body.removeChild(a); URL.revokeObjectURL(url);
}

// ── Impresión via iframe oculto (sin ventanas emergentes) ─────────────────────
const iframePrint = document.createElement('iframe');
iframePrint.style.cssText = 'position:fixed;top:-9999px;left:-9999px;width:1px;height:1px;border:none';
document.body.appendChild(iframePrint);

function imprimirComanda(mesaNombre, lineas) {
  const fecha = new Date().toLocaleTimeString('es-ES', {hour:'2-digit', minute:'2-digit'});
  const rows = lineas.map(l => `
    <tr>
      <td style="padding:4px 6px 4px 0;font-weight:bold;vertical-align:top">${l.qty}×</td>
      <td style="padding:4px 0;vertical-align:top">
        ${l.nombre}
        ${l.nota ? `<br><span style="font-size:11px;color:#555">↳ ${l.nota}</span>` : ''}
      </td>
    </tr>`).join('');

  const html = `<!DOCTYPE html><html><head><meta charset="UTF-8">
    <style>
      * { box-sizing: border-box; margin: 0; padding: 0; }
      body { font-family: monospace; font-size: 13px; padding: 8px; width: 100%; }
      h2 { font-size: 15px; font-weight: bold; margin-bottom: 2px; }
      .sub { font-size: 11px; color: #666; margin-bottom: 10px; }
      table { width: 100%; border-collapse: collapse; }
      tr { border-bottom: 1px solid #ddd; }
      tr:last-child { border-bottom: none; }
      @media print { body { padding: 0; } }
    </style></head><body>
    <h2>${ROL === 'cocina' ? '🍳 COCINA' : '🍺 BARRA'} — Mesa ${mesaNombre}</h2>
    <div class="sub">${fecha}</div>
    <table>${rows}</table>
    </body></html>`;

  iframePrint.srcdoc = html;
  iframePrint.onload = () => {
    try { iframePrint.contentWindow.focus(); iframePrint.contentWindow.print(); }
    catch(e) { console.warn('Error impresión iframe:', e); }
  };
}

function tick() {
  document.getElementById('clock').textContent =
    new Date().toLocaleTimeString('es-ES', {hour:'2-digit', minute:'2-digit'});
}
tick(); setInterval(tick, 10000);

// Audio beep
let audioCtx;
function beep() {
  try {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    const o = audioCtx.createOscillator();
    const g = audioCtx.createGain();
    o.connect(g); g.connect(audioCtx.destination);
    o.type = 'sine';
    o.frequency.setValueAtTime(880, audioCtx.currentTime);
    g.gain.setValueAtTime(.4, audioCtx.currentTime);
    g.gain.exponentialRampToValueAtTime(.001, audioCtx.currentTime + .35);
    o.start(); o.stop(audioCtx.currentTime + .35);
  } catch(e) {}
}

let mesasData = {};
let pedidosPorMesa = {};
let vistos = new Set(JSON.parse(localStorage.getItem('vistos_' + ROL) || '[]'));
let nuevosActivos = new Set();
let primeraVez = true;

function saveVistos() { localStorage.setItem('vistos_' + ROL, JSON.stringify([...vistos])); }

onValue(ref(db, 'mesas'), snap => { mesasData = snap.val() || {}; });

onValue(ref(db, 'pedidos'), snap => {
  const all = snap.val() || {};
  pedidosPorMesa = {};
  Object.entries(all).forEach(([mesaId, lineas]) => {
    const mias = Object.entries(lineas).filter(([,l]) => l.destino === ROL || l.destino === 'ambos');
    if (mias.length) pedidosPorMesa[mesaId] = Object.fromEntries(mias);
  });

  const antesNuevos = new Set(nuevosActivos);
  detectarNuevos();
  renderPedidos();

  if (!primeraVez && nuevosActivos.size > 0) {
    beep();
    // Imprimir automáticamente las mesas que son NUEVAS en esta actualización
    if (autoImprimir) {
      nuevosActivos.forEach(mesaId => {
        if (!antesNuevos.has(mesaId)) {
          const lineas = Object.values(pedidosPorMesa[mesaId] || {}).filter(l => l.estado === 'pendiente');
          const nombre = mesasData[mesaId]?.nombre || mesaId;
          imprimirComanda(nombre, lineas);
          if (autoTXT) generarTXT(nombre, lineas);
        }
      });
    }
  }
  primeraVez = false;
});

function detectarNuevos() {
  nuevosActivos.clear();
  Object.entries(pedidosPorMesa).forEach(([mesaId, lineas]) => {
    Object.keys(lineas).forEach(lineaId => {
      if (!vistos.has(mesaId + '/' + lineaId) && lineas[lineaId].estado === 'pendiente') {
        nuevosActivos.add(mesaId);
      }
    });
  });
  const hay = nuevosActivos.size > 0;
  document.body.classList.toggle('hay-nuevos', hay);
  const badge = document.getElementById('badge-nuevos');
  if (hay) {
    badge.style.display = '';
    badge.textContent = nuevosActivos.size + (nuevosActivos.size === 1 ? ' nueva mesa' : ' mesas nuevas');
  } else {
    badge.style.display = 'none';
  }
}

function renderPedidos() {
  const grid = document.getElementById('pedidos-grid');
  const empty = document.getElementById('empty-state');
  const mesasConPendientes = Object.entries(pedidosPorMesa).filter(([,ls]) =>
    Object.values(ls).some(l => l.estado === 'pendiente')
  );

  if (!mesasConPendientes.length) {
    empty.style.display = '';
    grid.style.display = 'none';
    return;
  }
  empty.style.display = 'none';
  grid.style.display = '';
  grid.innerHTML = '';

  mesasConPendientes
    .sort(([aId],[bId]) => (nuevosActivos.has(aId) ? 0 : 1) - (nuevosActivos.has(bId) ? 0 : 1))
    .forEach(([mesaId, lineas]) => grid.appendChild(crearCard(mesaId, lineas)));
}

function crearCard(mesaId, lineas) {
  const card = document.createElement('div');
  card.className = 'mesa-card' + (nuevosActivos.has(mesaId) ? ' nueva' : '');
  card.id = 'card-' + mesaId;

  const nombre = mesasData[mesaId]?.nombre || mesaId;
  const tiempos = Object.values(lineas).map(l => l.ts).filter(Boolean);
  const masViejo = tiempos.length ? Math.min(...tiempos) : null;

  const header = document.createElement('div');
  header.className = 'card-header';
  header.innerHTML = `
    <span class="dot"></span>
    <span class="card-mesa-name">Mesa ${nombre}</span>
    <span class="card-time">${masViejo ? tiempoRelativo(masViejo) : ''}</span>
    <button class="btn-imprimir" onclick="imprimirMesa('${mesaId}')" title="Imprimir comanda">🖨</button>`;
  header.addEventListener('click', e => {
    if (e.target.closest('.btn-imprimir')) return;
    marcarVista(mesaId, lineas);
  });
  card.appendChild(header);

  Object.entries(lineas)
    .filter(([,l]) => l.estado === 'pendiente')
    .sort(([,a],[,b]) => (a.ts||0) - (b.ts||0))
    .forEach(([lineaId, l]) => {
      const row = document.createElement('div');
      row.className = 'linea-row';
      row.id = 'linea-' + lineaId;

      const main = document.createElement('div');
      main.className = 'linea-main';
      main.innerHTML = `
        <span class="linea-qty">${l.qty}</span>
        <span class="linea-nombre">${l.nombre}</span>
        <button class="btn-servido" onclick="marcarServido('${mesaId}','${lineaId}',this)">Servido</button>
        <button class="btn-stock" onclick="marcarSinStock('${mesaId}','${lineaId}',this)" title="Sin stock — quitar sin cobrar">✕</button>`;
      row.appendChild(main);

      // Nota si existe
      if (l.nota && l.nota.trim()) {
        const nota = document.createElement('div');
        nota.className = 'linea-nota';
        nota.textContent = '↳ ' + l.nota;
        row.appendChild(nota);
      }

      card.appendChild(row);
    });

  return card;
}

function marcarVista(mesaId, lineas) {
  Object.keys(lineas).forEach(lid => vistos.add(mesaId + '/' + lid));
  saveVistos();
  const card = document.getElementById('card-' + mesaId);
  if (card) card.classList.remove('nueva');
  nuevosActivos.delete(mesaId);
  detectarNuevos();
}

window.marcarServido = async (mesaId, lineaId, btn) => {
  if (btn.classList.contains('hecho')) return;
  btn.disabled = true; btn.textContent = '…';
  await set(ref(db, `pedidos/${mesaId}/${lineaId}/estado`), 'servido');
  vistos.add(mesaId + '/' + lineaId);
  saveVistos();
  btn.className = 'btn-servido hecho'; btn.textContent = '✓ Servido'; btn.disabled = false;
  btn.closest('.linea-row').classList.add('servida');

  const snap = await get(ref(db, 'pedidos/' + mesaId));
  const lineas = snap.val() || {};
  const quedanMias = Object.values(lineas).filter(l =>
    (l.destino === ROL || l.destino === 'ambos') && l.estado === 'pendiente'
  );
  if (!quedanMias.length) {
    const card = document.getElementById('card-' + mesaId);
    if (card) card.classList.remove('nueva');
    nuevosActivos.delete(mesaId);
    detectarNuevos();
    setTimeout(() => renderPedidos(), 800);
  }
};

window.marcarSinStock = async (mesaId, lineaId, btn) => {
  if (btn.disabled) return;
  btn.disabled = true;
  await set(ref(db, `pedidos/${mesaId}/${lineaId}/estado`), 'cancelado');
  const row = btn.closest('.linea-row');
  if (row) { row.style.opacity = '.3'; row.style.textDecoration = 'line-through'; }
  btn.disabled = false;
  const snap = await get(ref(db, 'pedidos/' + mesaId));
  const ls   = snap.val() || {};
  const quedan = Object.values(ls).filter(l => (l.destino===ROL||l.destino==='ambos') && l.estado==='pendiente');
  if (!quedan.length) { nuevosActivos.delete(mesaId); detectarNuevos(); setTimeout(() => renderPedidos(), 600); }
};

function tiempoRelativo(ts) {
  const diff = Math.floor((Date.now() - ts) / 60000);
  if (diff < 1) return 'ahora';
  if (diff === 1) return 'hace 1 min';
  return `hace ${diff} min`;
}

window.imprimirMesa = mesaId => {
  const lineas = Object.values(pedidosPorMesa[mesaId] || {}).filter(l => l.estado === 'pendiente');
  if (!lineas.length) return;
  const nombre = mesasData[mesaId]?.nombre || mesaId;
  imprimirComanda(nombre, lineas);
  if (autoTXT) generarTXT(nombre, lineas);
};
</script>
