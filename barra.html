<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title id="page-title">Barra · Comandero</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  /* ── VARIABLES POR ROL (se sobrescriben desde JS) ── */
  :root {
    --accent:    #e8ff5a;
    --accent-dim: rgba(232,255,90,0.13);
    --accent-text: #1a1a1a;
    --bg: #111;
    --surface: #1a1a1a;
    --surface2: #232323;
    --border: #2c2c2c;
    --text: #f0f0f0;
    --muted: #555;
    --sans: 'DM Sans', sans-serif;
    --mono: 'DM Mono', monospace;
  }
  /* COCINA override se aplica vía JS añadiendo clase al :root */
  .rol-cocina {
    --accent: #5af0ff;
    --accent-dim: rgba(90,240,255,0.12);
    --accent-text: #001f24;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  body { background: var(--bg); color: var(--text); font-family: var(--sans); min-height: 100vh; }

  /* ── TOPBAR ── */
  .topbar {
    background: var(--surface); border-bottom: 1px solid var(--border);
    padding: 0 1rem; height: 54px; display: flex; align-items: center; gap: 12px;
    position: sticky; top: 0; z-index: 20;
  }
  .topbar-title { font-family: var(--mono); font-size: 17px; color: var(--accent); }
  .spacer { flex: 1; }
  .badge-nuevos {
    background: var(--accent-dim); color: var(--accent);
    font-family: var(--mono); font-size: 12px; padding: 4px 12px;
    border-radius: 20px; border: 1px solid var(--accent);
    display: none;
  }
  .clock { font-family: var(--mono); font-size: 13px; color: var(--muted); }

  /* ── ALERTA NUEVA ── */
  @keyframes flash-bg {
    0%,100% { background: var(--bg); }
    50%      { background: var(--accent-dim); }
  }
  @keyframes pulse-dot {
    0%,100% { opacity: 1; transform: scale(1); }
    50%      { opacity: .3; transform: scale(.7); }
  }
  body.hay-nuevos { animation: flash-bg 1.4s ease-in-out infinite; }

  /* ── GRID PEDIDOS ── */
  .pedidos-grid {
    padding: 1rem;
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
    gap: 12px;
    align-items: start;
  }
  .empty-state {
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    min-height: 50vh; gap: 12px; color: var(--muted);
  }
  .empty-icon {
    width: 56px; height: 56px; border: 2px solid var(--border);
    border-radius: 12px; display: flex; align-items: center; justify-content: center;
    font-size: 24px;
  }
  .empty-text { font-family: var(--mono); font-size: 14px; }

  /* ── TARJETA MESA ── */
  .mesa-card {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 14px; overflow: hidden;
    transition: border-color .3s;
  }
  .mesa-card.nueva { border-color: var(--accent); animation: flash-bg 1.4s ease-in-out infinite; }
  .mesa-card.nueva:hover { animation-play-state: paused; }

  .card-header {
    display: flex; align-items: center; gap: 8px;
    padding: 10px 14px; background: var(--surface2);
    border-bottom: 1px solid var(--border);
  }
  .dot {
    width: 8px; height: 8px; border-radius: 50%; background: var(--accent);
    flex-shrink: 0; animation: pulse-dot 1s ease-in-out infinite;
    display: none;
  }
  .mesa-card.nueva .dot { display: block; }
  .card-mesa-name { font-family: var(--mono); font-size: 14px; font-weight: 500; color: var(--accent); flex: 1; }
  .card-time { font-family: var(--mono); font-size: 11px; color: var(--muted); }

  /* ── LÍNEAS ── */
  .linea-row {
    display: flex; align-items: center; gap: 8px;
    padding: 10px 14px; border-bottom: 1px solid var(--border);
    transition: opacity .25s;
  }
  .linea-row:last-child { border-bottom: none; }
  .linea-row.servida { opacity: .35; }
  .linea-qty { font-family: var(--mono); font-size: 16px; font-weight: 500; min-width: 24px; color: var(--accent); }
  .linea-row.servida .linea-qty { color: var(--muted); }
  .linea-nombre { flex: 1; font-size: 15px; }
  .linea-nota { font-size: 12px; color: var(--muted); font-style: italic; }

  .btn-servido {
    font-family: var(--mono); font-size: 12px; padding: 6px 12px;
    border-radius: 8px; border: 1px solid var(--border);
    background: var(--surface2); color: var(--muted);
    cursor: pointer; white-space: nowrap; transition: all .15s;
  }
  .btn-servido:active { background: var(--border); }
  .btn-servido.hecho {
    border-color: rgba(90,255,154,.25); color: #5aff9a;
    background: rgba(90,255,154,.08); cursor: default;
  }

  /* Sonido visual */
  @keyframes ring {
    0%   { box-shadow: 0 0 0 0 var(--accent); }
    70%  { box-shadow: 0 0 0 12px transparent; }
    100% { box-shadow: 0 0 0 0 transparent; }
  }
  .mesa-card.nueva { animation: flash-bg 1.4s ease-in-out infinite, ring 1.4s ease-out infinite; }
</style>
</head>
<body>

<div class="topbar">
  <span class="topbar-title" id="topbar-title">Barra</span>
  <div class="spacer"></div>
  <span class="badge-nuevos" id="badge-nuevos"></span>
  <span class="clock" id="clock"></span>
</div>

<div id="pedidos-container">
  <div class="empty-state" id="empty-state">
    <div class="empty-icon">—</div>
    <span class="empty-text">Sin pedidos pendientes</span>
  </div>
  <div class="pedidos-grid" id="pedidos-grid"></div>
</div>

<script type="module">
import { db } from './firebase.js';
import {
  ref, onValue, set, get
} from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";

// ─── ROL: barra o cocina según URL ────────────────────────────────────────────
const escocina = location.pathname.includes('cocina') || location.search.includes('rol=cocina');
const ROL = escocina ? 'cocina' : 'barra';

if (ROL === 'cocina') {
  document.documentElement.classList.add('rol-cocina');
  document.getElementById('topbar-title').textContent = 'Cocina';
  document.title = 'Cocina · Comandero';
}

// ─── RELOJ ────────────────────────────────────────────────────────────────────
function tick() {
  document.getElementById('clock').textContent =
    new Date().toLocaleTimeString('es-ES', {hour:'2-digit', minute:'2-digit'});
}
tick(); setInterval(tick, 10000);

// ─── AUDIO beep Web Audio API ─────────────────────────────────────────────────
let audioCtx;
function beep() {
  try {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    const o = audioCtx.createOscillator();
    const g = audioCtx.createGain();
    o.connect(g); g.connect(audioCtx.destination);
    o.type = 'sine';
    o.frequency.setValueAtTime(880, audioCtx.currentTime);
    g.gain.setValueAtTime(.4, audioCtx.currentTime);
    g.gain.exponentialRampToValueAtTime(.001, audioCtx.currentTime + .35);
    o.start(); o.stop(audioCtx.currentTime + .35);
  } catch(e) {}
}

// ─── ESTADO LOCAL ────────────────────────────────────────────────────────────
let mesasData = {};
let pedidosPorMesa = {}; // mesaId → { lineaId → linea }
let vistos = new Set(JSON.parse(localStorage.getItem('vistos_' + ROL) || '[]'));
let nuevosActivos = new Set();

function saveVistos() {
  localStorage.setItem('vistos_' + ROL, JSON.stringify([...vistos]));
}

// ─── ESCUCHA MESAS ────────────────────────────────────────────────────────────
onValue(ref(db, 'mesas'), snap => { mesasData = snap.val() || {}; });

// ─── ESCUCHA PEDIDOS ─────────────────────────────────────────────────────────
onValue(ref(db, 'pedidos'), snap => {
  const allPedidos = snap.val() || {};
  pedidosPorMesa = {};

  Object.entries(allPedidos).forEach(([mesaId, lineas]) => {
    const miasLineas = Object.entries(lineas).filter(([,l]) =>
      l.destino === ROL || l.destino === 'ambos'
    );
    if (miasLineas.length) pedidosPorMesa[mesaId] = Object.fromEntries(miasLineas);
  });

  detectarNuevos();
  renderPedidos();
});

function detectarNuevos() {
  nuevosActivos.clear();
  Object.entries(pedidosPorMesa).forEach(([mesaId, lineas]) => {
    Object.keys(lineas).forEach(lineaId => {
      const key = mesaId + '/' + lineaId;
      if (!vistos.has(key) && lineas[lineaId].estado === 'pendiente') {
        nuevosActivos.add(mesaId);
      }
    });
  });
  const hayNuevos = nuevosActivos.size > 0;
  document.body.classList.toggle('hay-nuevos', hayNuevos);
  const badge = document.getElementById('badge-nuevos');
  if (hayNuevos) {
    badge.style.display = '';
    badge.textContent = nuevosActivos.size + (nuevosActivos.size === 1 ? ' nueva mesa' : ' mesas nuevas');
  } else {
    badge.style.display = 'none';
  }
}

// ─── RENDER ───────────────────────────────────────────────────────────────────
function renderPedidos() {
  const grid = document.getElementById('pedidos-grid');
  const empty = document.getElementById('empty-state');
  const mesasConPendientes = Object.entries(pedidosPorMesa).filter(([,ls]) =>
    Object.values(ls).some(l => l.estado === 'pendiente')
  );

  if (!mesasConPendientes.length) {
    empty.style.display = '';
    grid.style.display = 'none';
    return;
  }
  empty.style.display = 'none';
  grid.style.display = '';
  grid.innerHTML = '';

  // Ordenar: nuevas primero, luego por tiempo
  mesasConPendientes
    .sort(([aId], [bId]) => {
      const aN = nuevosActivos.has(aId) ? 0 : 1;
      const bN = nuevosActivos.has(bId) ? 0 : 1;
      return aN - bN;
    })
    .forEach(([mesaId, lineas]) => {
      const card = crearCard(mesaId, lineas);
      grid.appendChild(card);
    });
}

function crearCard(mesaId, lineas) {
  const card = document.createElement('div');
  const esNueva = nuevosActivos.has(mesaId);
  card.className = 'mesa-card' + (esNueva ? ' nueva' : '');
  card.id = 'card-' + mesaId;

  const mesaNombre = mesasData[mesaId]?.nombre || mesaId;
  const tiempos = Object.values(lineas).map(l => l.ts).filter(Boolean);
  const masViejo = tiempos.length ? Math.min(...tiempos) : null;
  const tiempoStr = masViejo ? tiempoRelativo(masViejo) : '';

  card.innerHTML = `
    <div class="card-header">
      <span class="dot"></span>
      <span class="card-mesa-name">Mesa ${mesaNombre}</span>
      <span class="card-time">${tiempoStr}</span>
    </div>
  `;

  // Al tocar la tarjeta, marcar como vista
  card.querySelector('.card-header').addEventListener('click', () => marcarVista(mesaId, lineas));

  Object.entries(lineas)
    .filter(([,l]) => l.estado === 'pendiente')
    .sort(([,a],[,b]) => (a.ts||0) - (b.ts||0))
    .forEach(([lineaId, l]) => {
      const key = mesaId + '/' + lineaId;
      const servida = l.estado === 'servido';
      const row = document.createElement('div');
      row.className = 'linea-row' + (servida ? ' servida' : '');
      row.id = 'linea-' + lineaId;
      row.innerHTML = `
        <span class="linea-qty">${l.qty}</span>
        <span class="linea-nombre">${l.nombre}</span>
        <button class="${servida ? 'btn-servido hecho' : 'btn-servido'}"
          onclick="marcarServido('${mesaId}','${lineaId}',this)">
          ${servida ? '✓ Servido' : 'Servido'}
        </button>
      `;
      card.appendChild(row);
    });

  return card;
}

function marcarVista(mesaId, lineas) {
  Object.keys(lineas).forEach(lineaId => {
    vistos.add(mesaId + '/' + lineaId);
  });
  saveVistos();
  const card = document.getElementById('card-' + mesaId);
  if (card) { card.classList.remove('nueva'); }
  nuevosActivos.delete(mesaId);
  detectarNuevos();
}

window.marcarServido = async (mesaId, lineaId, btn) => {
  btn.disabled = true;
  btn.textContent = '…';
  await set(ref(db, `pedidos/${mesaId}/${lineaId}/estado`), 'servido');
  vistos.add(mesaId + '/' + lineaId);
  saveVistos();
  btn.className = 'btn-servido hecho';
  btn.textContent = '✓ Servido';
  btn.closest('.linea-row').classList.add('servida');
  // ¿quedan pendientes en esta mesa?
  const snap = await get(ref(db, 'pedidos/' + mesaId));
  const lineas = snap.val() || {};
  const quedanMias = Object.values(lineas).filter(l =>
    (l.destino === ROL || l.destino === 'ambos') && l.estado === 'pendiente'
  );
  if (!quedanMias.length) {
    const card = document.getElementById('card-' + mesaId);
    if (card) card.classList.remove('nueva');
    nuevosActivos.delete(mesaId);
    detectarNuevos();
    setTimeout(() => { renderPedidos(); }, 800);
  }
};

// ─── BEEP cuando llega nuevo pedido ──────────────────────────────────────────
let primeraVez = true;
onValue(ref(db, 'pedidos'), () => {
  if (primeraVez) { primeraVez = false; return; }
  if (nuevosActivos.size > 0) beep();
});

// ─── TIEMPO RELATIVO ─────────────────────────────────────────────────────────
function tiempoRelativo(ts) {
  const diff = Math.floor((Date.now() - ts) / 60000);
  if (diff < 1) return 'ahora';
  if (diff === 1) return 'hace 1 min';
  return `hace ${diff} min`;
}
</script>
</body>
</html>
