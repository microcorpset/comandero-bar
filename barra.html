<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title id="page-title">Barra · Comandero</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --accent: #e8ff5a; --accent-dim: rgba(232,255,90,0.13); --accent-text: #1a1a1a;
    --bg: #111; --surface: #1a1a1a; --surface2: #232323; --border: #2c2c2c;
    --text: #f0f0f0; --muted: #555; --sans: 'DM Sans', sans-serif; --mono: 'DM Mono', monospace;
  }
  .rol-cocina { --accent: #5af0ff; --accent-dim: rgba(90,240,255,0.12); --accent-text: #001f24; }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  body { background: var(--bg); color: var(--text); font-family: var(--sans); min-height: 100vh; }

  .topbar {
    background: var(--surface); border-bottom: 1px solid var(--border);
    padding: 0 1rem; height: 54px; display: flex; align-items: center; gap: 12px;
    position: sticky; top: 0; z-index: 20;
  }
  .topbar-title { font-family: var(--mono); font-size: 17px; color: var(--accent); }
  .spacer { flex: 1; }
  .badge-nuevos {
    background: var(--accent-dim); color: var(--accent);
    font-family: var(--mono); font-size: 12px; padding: 4px 12px;
    border-radius: 20px; border: 1px solid var(--accent); display: none;
  }
  .clock { font-family: var(--mono); font-size: 13px; color: var(--muted); }

  @keyframes flash-bg { 0%,100%{background:var(--bg)} 50%{background:var(--accent-dim)} }
  @keyframes pulse-dot { 0%,100%{opacity:1;transform:scale(1)} 50%{opacity:.3;transform:scale(.7)} }
  body.hay-nuevos { animation: flash-bg 1.4s ease-in-out infinite; }

  .pedidos-grid {
    padding: 1rem;
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
    gap: 12px;
    align-items: start;
  }
  .empty-state { display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 50vh; gap: 12px; color: var(--muted); }
  .empty-icon { width: 56px; height: 56px; border: 2px solid var(--border); border-radius: 12px; display: flex; align-items: center; justify-content: center; font-size: 24px; }
  .empty-text { font-family: var(--mono); font-size: 14px; }

  .mesa-card {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 14px; overflow: hidden; transition: border-color .3s;
  }
  .mesa-card.nueva { border-color: var(--accent); animation: flash-bg 1.4s ease-in-out infinite; }

  .card-header {
    display: flex; align-items: center; gap: 8px;
    padding: 10px 14px; background: var(--surface2);
    border-bottom: 1px solid var(--border); cursor: pointer;
  }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--accent); flex-shrink: 0; animation: pulse-dot 1s ease-in-out infinite; display: none; }
  .mesa-card.nueva .dot { display: block; }
  .card-mesa-name { font-family: var(--mono); font-size: 14px; font-weight: 500; color: var(--accent); flex: 1; }
  .card-time { font-family: var(--mono); font-size: 11px; color: var(--muted); }

  /* Línea de pedido */
  .linea-row {
    padding: 10px 14px; border-bottom: 1px solid var(--border);
    transition: opacity .25s;
  }
  .linea-row:last-child { border-bottom: none; }
  .linea-row.servida { opacity: .35; }

  .linea-main { display: flex; align-items: center; gap: 8px; }
  .linea-qty { font-family: var(--mono); font-size: 16px; font-weight: 500; min-width: 24px; color: var(--accent); }
  .linea-row.servida .linea-qty { color: var(--muted); }
  .linea-nombre { flex: 1; font-size: 15px; }

  /* Nota visible bajo el nombre */
  .linea-nota {
    margin-top: 4px; margin-left: 32px;
    font-size: 12px; color: var(--accent); font-family: var(--mono);
    background: var(--accent-dim); border-left: 2px solid var(--accent);
    padding: 3px 8px; border-radius: 0 4px 4px 0;
    display: inline-block;
  }
  .linea-row.servida .linea-nota { color: var(--muted); background: transparent; border-color: var(--border); }

  .btn-servido {
    font-family: var(--mono); font-size: 12px; padding: 6px 12px;
    border-radius: 8px; border: 1px solid var(--border);
    background: var(--surface2); color: var(--muted);
    cursor: pointer; white-space: nowrap; transition: all .15s; flex-shrink: 0;
  }
  .btn-servido:active { background: var(--border); }
  .btn-servido.hecho { border-color: rgba(90,255,154,.25); color: #5aff9a; background: rgba(90,255,154,.08); cursor: default; }
</style>
</head>
<body>

<div class="topbar">
  <span class="topbar-title" id="topbar-title">Barra</span>
  <div class="spacer"></div>
  <span class="badge-nuevos" id="badge-nuevos"></span>
  <span class="clock" id="clock"></span>
</div>

<div id="pedidos-container">
  <div class="empty-state" id="empty-state">
    <div class="empty-icon">—</div>
    <span class="empty-text">Sin pedidos pendientes</span>
  </div>
  <div class="pedidos-grid" id="pedidos-grid" style="display:none"></div>
</div>

<script type="module">
import { db } from './firebase.js';
import { ref, onValue, set, get } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";

const escocina = location.pathname.includes('cocina') || location.search.includes('rol=cocina');
const ROL = escocina ? 'cocina' : 'barra';

if (ROL === 'cocina') {
  document.documentElement.classList.add('rol-cocina');
  document.getElementById('topbar-title').textContent = 'Cocina';
  document.title = 'Cocina · Comandero';
}

function tick() {
  document.getElementById('clock').textContent =
    new Date().toLocaleTimeString('es-ES', {hour:'2-digit', minute:'2-digit'});
}
tick(); setInterval(tick, 10000);

// Audio beep
let audioCtx;
function beep() {
  try {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    const o = audioCtx.createOscillator();
    const g = audioCtx.createGain();
    o.connect(g); g.connect(audioCtx.destination);
    o.type = 'sine';
    o.frequency.setValueAtTime(880, audioCtx.currentTime);
    g.gain.setValueAtTime(.4, audioCtx.currentTime);
    g.gain.exponentialRampToValueAtTime(.001, audioCtx.currentTime + .35);
    o.start(); o.stop(audioCtx.currentTime + .35);
  } catch(e) {}
}

let mesasData = {};
let pedidosPorMesa = {};
let vistos = new Set(JSON.parse(localStorage.getItem('vistos_' + ROL) || '[]'));
let nuevosActivos = new Set();
let primeraVez = true;

function saveVistos() { localStorage.setItem('vistos_' + ROL, JSON.stringify([...vistos])); }

onValue(ref(db, 'mesas'), snap => { mesasData = snap.val() || {}; });

onValue(ref(db, 'pedidos'), snap => {
  const all = snap.val() || {};
  pedidosPorMesa = {};
  Object.entries(all).forEach(([mesaId, lineas]) => {
    const mias = Object.entries(lineas).filter(([,l]) => l.destino === ROL || l.destino === 'ambos');
    if (mias.length) pedidosPorMesa[mesaId] = Object.fromEntries(mias);
  });
  detectarNuevos();
  renderPedidos();
  if (!primeraVez && nuevosActivos.size > 0) beep();
  primeraVez = false;
});

function detectarNuevos() {
  nuevosActivos.clear();
  Object.entries(pedidosPorMesa).forEach(([mesaId, lineas]) => {
    Object.keys(lineas).forEach(lineaId => {
      if (!vistos.has(mesaId + '/' + lineaId) && lineas[lineaId].estado === 'pendiente') {
        nuevosActivos.add(mesaId);
      }
    });
  });
  const hay = nuevosActivos.size > 0;
  document.body.classList.toggle('hay-nuevos', hay);
  const badge = document.getElementById('badge-nuevos');
  if (hay) {
    badge.style.display = '';
    badge.textContent = nuevosActivos.size + (nuevosActivos.size === 1 ? ' nueva mesa' : ' mesas nuevas');
  } else {
    badge.style.display = 'none';
  }
}

function renderPedidos() {
  const grid = document.getElementById('pedidos-grid');
  const empty = document.getElementById('empty-state');
  const mesasConPendientes = Object.entries(pedidosPorMesa).filter(([,ls]) =>
    Object.values(ls).some(l => l.estado === 'pendiente')
  );

  if (!mesasConPendientes.length) {
    empty.style.display = '';
    grid.style.display = 'none';
    return;
  }
  empty.style.display = 'none';
  grid.style.display = '';
  grid.innerHTML = '';

  mesasConPendientes
    .sort(([aId],[bId]) => (nuevosActivos.has(aId) ? 0 : 1) - (nuevosActivos.has(bId) ? 0 : 1))
    .forEach(([mesaId, lineas]) => grid.appendChild(crearCard(mesaId, lineas)));
}

function crearCard(mesaId, lineas) {
  const card = document.createElement('div');
  card.className = 'mesa-card' + (nuevosActivos.has(mesaId) ? ' nueva' : '');
  card.id = 'card-' + mesaId;

  const nombre = mesasData[mesaId]?.nombre || mesaId;
  const tiempos = Object.values(lineas).map(l => l.ts).filter(Boolean);
  const masViejo = tiempos.length ? Math.min(...tiempos) : null;

  const header = document.createElement('div');
  header.className = 'card-header';
  header.innerHTML = `
    <span class="dot"></span>
    <span class="card-mesa-name">Mesa ${nombre}</span>
    <span class="card-time">${masViejo ? tiempoRelativo(masViejo) : ''}</span>`;
  header.addEventListener('click', () => marcarVista(mesaId, lineas));
  card.appendChild(header);

  Object.entries(lineas)
    .filter(([,l]) => l.estado === 'pendiente')
    .sort(([,a],[,b]) => (a.ts||0) - (b.ts||0))
    .forEach(([lineaId, l]) => {
      const row = document.createElement('div');
      row.className = 'linea-row';
      row.id = 'linea-' + lineaId;

      const main = document.createElement('div');
      main.className = 'linea-main';
      main.innerHTML = `
        <span class="linea-qty">${l.qty}</span>
        <span class="linea-nombre">${l.nombre}</span>
        <button class="btn-servido" onclick="marcarServido('${mesaId}','${lineaId}',this)">Servido</button>`;
      row.appendChild(main);

      // Nota si existe
      if (l.nota && l.nota.trim()) {
        const nota = document.createElement('div');
        nota.className = 'linea-nota';
        nota.textContent = '↳ ' + l.nota;
        row.appendChild(nota);
      }

      card.appendChild(row);
    });

  return card;
}

function marcarVista(mesaId, lineas) {
  Object.keys(lineas).forEach(lid => vistos.add(mesaId + '/' + lid));
  saveVistos();
  const card = document.getElementById('card-' + mesaId);
  if (card) card.classList.remove('nueva');
  nuevosActivos.delete(mesaId);
  detectarNuevos();
}

window.marcarServido = async (mesaId, lineaId, btn) => {
  if (btn.classList.contains('hecho')) return;
  btn.disabled = true; btn.textContent = '…';
  await set(ref(db, `pedidos/${mesaId}/${lineaId}/estado`), 'servido');
  vistos.add(mesaId + '/' + lineaId);
  saveVistos();
  btn.className = 'btn-servido hecho'; btn.textContent = '✓ Servido'; btn.disabled = false;
  btn.closest('.linea-row').classList.add('servida');

  const snap = await get(ref(db, 'pedidos/' + mesaId));
  const lineas = snap.val() || {};
  const quedanMias = Object.values(lineas).filter(l =>
    (l.destino === ROL || l.destino === 'ambos') && l.estado === 'pendiente'
  );
  if (!quedanMias.length) {
    const card = document.getElementById('card-' + mesaId);
    if (card) card.classList.remove('nueva');
    nuevosActivos.delete(mesaId);
    detectarNuevos();
    setTimeout(() => renderPedidos(), 800);
  }
};

function tiempoRelativo(ts) {
  const diff = Math.floor((Date.now() - ts) / 60000);
  if (diff < 1) return 'ahora';
  if (diff === 1) return 'hace 1 min';
  return `hace ${diff} min`;
}
</script>
</body>
</html>
