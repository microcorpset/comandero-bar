<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Camarero · Comandero</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f7f5f0; --surface: #ffffff; --surface2: #f0ede6;
    --border: #e0ddd6; --accent: #1a1a1a; --accent2: #3d7aff;
    --danger: #e53535; --text: #1a1a1a; --muted: #999;
    --mono: 'DM Mono', monospace; --sans: 'DM Sans', sans-serif;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  body { background: var(--bg); color: var(--text); font-family: var(--sans); min-height: 100vh; overflow-x: hidden; }

  /* TOPBAR */
  .topbar {
    background: var(--surface); border-bottom: 1px solid var(--border);
    padding: 0 1rem; height: 52px; display: flex; align-items: center; gap: 10px;
    position: sticky; top: 0; z-index: 40;
  }
  .topbar-title { font-family: var(--mono); font-size: 15px; font-weight: 500; }
  .mesa-badge { background: var(--accent); color: #fff; font-family: var(--mono); font-size: 13px; padding: 3px 10px; border-radius: 20px; display: none; }
  .spacer { flex: 1; }
  .btn-carrito {
    position: relative; background: none; border: 1.5px solid var(--border);
    border-radius: 8px; padding: 6px 12px; cursor: pointer; font-family: var(--mono);
    font-size: 13px; color: var(--text); display: none; align-items: center; gap: 6px;
  }
  .btn-carrito.tiene { border-color: var(--accent2); color: var(--accent2); display: flex; }
  .carrito-count { background: var(--accent2); color: #fff; border-radius: 20px; font-size: 11px; padding: 1px 6px; font-weight: 500; }

  /* MESAS */
  #view-mesas { padding: 1rem; }
  .mesas-title { font-family: var(--mono); font-size: 11px; color: var(--muted); letter-spacing: .08em; text-transform: uppercase; margin-bottom: .75rem; }
  .mesas-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(90px,1fr)); gap: 10px; }
  .mesa-btn {
    aspect-ratio: 1; background: var(--surface); border: 1.5px solid var(--border);
    border-radius: 12px; display: flex; flex-direction: column;
    align-items: center; justify-content: center; cursor: pointer;
    transition: border .15s, background .15s; gap: 4px;
  }
  .mesa-btn:active { background: var(--surface2); }
  .mesa-btn.ocupada { border-color: var(--accent2); background: rgba(61,122,255,.06); }
  .mesa-nombre { font-family: var(--mono); font-size: 18px; font-weight: 500; }
  .mesa-estado { font-size: 11px; color: var(--muted); }
  .mesa-btn.ocupada .mesa-estado { color: var(--accent2); }

  /* CARTA */
  #view-carta { display: none; }
  .carta-scroll { padding-bottom: 80px; }
  .cat-section { border-bottom: 1px solid var(--border); }
  .cat-toggle {
    display: flex; align-items: center; gap: 10px;
    padding: 12px 1rem; background: var(--bg); cursor: pointer;
    position: sticky; top: 52px; z-index: 5;
    border-bottom: 1px solid var(--border); user-select: none;
  }
  .cat-toggle:active { background: var(--surface2); }
  .cat-nombre-label { font-family: var(--mono); font-size: 12px; font-weight: 500; color: var(--muted); letter-spacing: .06em; text-transform: uppercase; flex: 1; }
  .cat-count { font-family: var(--mono); font-size: 11px; color: var(--accent2); background: rgba(61,122,255,.08); padding: 2px 8px; border-radius: 20px; display: none; }
  .cat-count.visible { display: inline; }
  .cat-arrow { font-size: 12px; color: var(--muted); transition: transform .2s; }
  .cat-section.collapsed .cat-arrow { transform: rotate(-90deg); }
  .cat-items { overflow: hidden; transition: max-height .25s ease; }
  .cat-section.collapsed .cat-items { max-height: 0 !important; }

  /* Artículo en carta */
  .art-row {
    background: var(--surface); border-bottom: 1px solid var(--border);
  }
  .art-row:last-child { border-bottom: none; }
  .art-main {
    display: flex; align-items: center; gap: 10px;
    padding: 10px 1rem; user-select: none;
  }
  .art-nombre { flex: 1; font-size: 15px; line-height: 1.3; }
  .art-precio { font-family: var(--mono); font-size: 13px; color: var(--muted); white-space: nowrap; }
  .qty-ctrl { display: flex; align-items: center; flex-shrink: 0; }
  .qty-btn {
    width: 36px; height: 36px; border: 1px solid var(--border);
    background: var(--surface2); font-size: 22px; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    color: var(--text); transition: background .1s;
  }
  .qty-btn:first-child { border-radius: 8px 0 0 8px; }
  .qty-btn:last-child  { border-radius: 0 8px 8px 0; }
  .qty-btn:active { background: var(--border); }
  .qty-num {
    width: 36px; height: 36px; display: flex; align-items: center; justify-content: center;
    font-family: var(--mono); font-size: 15px; font-weight: 500;
    border-top: 1px solid var(--border); border-bottom: 1px solid var(--border);
    background: var(--surface);
  }
  .qty-num.has-qty { color: var(--accent2); font-weight: 700; background: rgba(61,122,255,.05); }

  /* Nota inline bajo el artículo (aparece cuando qty > 0) */
  .art-nota-row {
    padding: 0 1rem 10px; display: none;
  }
  .art-nota-row.visible { display: flex; gap: 8px; align-items: center; }
  .nota-input {
    flex: 1; background: var(--bg); border: 1px solid var(--border);
    border-radius: 8px; padding: 6px 10px; font-size: 13px; font-family: var(--sans);
    color: var(--text); outline: none; transition: border .15s;
  }
  .nota-input:focus { border-color: var(--accent2); }
  .nota-input::placeholder { color: var(--muted); }
  .nota-label { font-size: 11px; color: var(--muted); white-space: nowrap; }

  /* BARRA INFERIOR */
  .bottom-bar {
    position: fixed; bottom: 0; left: 0; right: 0;
    background: var(--surface); border-top: 1px solid var(--border);
    padding: .75rem 1rem; display: flex; align-items: center; gap: 10px;
    z-index: 30;
  }
  .btn { border-radius: 8px; padding: 9px 16px; font-family: var(--mono); font-size: 13px; cursor: pointer; transition: opacity .15s, background .15s; white-space: nowrap; border: 1px solid var(--border); }
  .btn-back  { background: none; color: var(--text); }
  .btn-back:active { background: var(--surface2); }
  .btn-cuenta { background: none; color: var(--accent2); border-color: var(--accent2); }
  .btn-enviar { background: var(--accent); color: #fff; border-color: var(--accent); font-weight: 500; }
  .btn-enviar:disabled { opacity: .3; cursor: default; }
  .resumen-info { flex: 1; min-width: 0; }
  .resumen-lineas { font-family: var(--mono); font-size: 11px; color: var(--muted); }
  .resumen-total  { font-family: var(--mono); font-size: 17px; font-weight: 500; }

  /* DRAWER */
  .drawer-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,.35); z-index: 50; }
  .drawer-overlay.open { display: block; }
  .drawer {
    position: fixed; bottom: 0; left: 0; right: 0;
    background: var(--surface); border-radius: 16px 16px 0 0;
    border-top: 1px solid var(--border); z-index: 51;
    transform: translateY(100%); transition: transform .28s cubic-bezier(.4,0,.2,1);
    max-height: 80vh; display: flex; flex-direction: column;
  }
  .drawer.open { transform: translateY(0); }
  .drawer-handle { width: 36px; height: 4px; background: var(--border); border-radius: 2px; margin: 10px auto 0; flex-shrink: 0; }
  .drawer-header { display: flex; align-items: center; gap: 10px; padding: 12px 1rem 10px; border-bottom: 1px solid var(--border); flex-shrink: 0; }
  .drawer-title { font-family: var(--mono); font-size: 14px; font-weight: 500; flex: 1; }
  .drawer-close { background: none; border: none; font-size: 22px; cursor: pointer; color: var(--muted); padding: 0 4px; line-height: 1; }
  .drawer-body { overflow-y: auto; flex: 1; }
  .drawer-empty { padding: 2rem 1rem; text-align: center; font-family: var(--mono); font-size: 13px; color: var(--muted); }

  /* Item en drawer */
  .ri-wrap { border-bottom: 1px solid var(--border); }
  .ri-wrap:last-child { border-bottom: none; }
  .ri-main { display: flex; align-items: center; gap: 8px; padding: 10px 1rem 6px; }
  .ri-nombre { flex: 1; font-size: 14px; }
  /* qty control en drawer */
  .ri-qty-ctrl { display: flex; align-items: center; flex-shrink: 0; }
  .ri-qty-btn {
    width: 30px; height: 30px; border: 1px solid var(--border); background: var(--surface2);
    font-size: 18px; cursor: pointer; display: flex; align-items: center; justify-content: center;
    color: var(--text); transition: background .1s;
  }
  .ri-qty-btn:first-child { border-radius: 6px 0 0 6px; }
  .ri-qty-btn:last-child  { border-radius: 0 6px 6px 0; }
  .ri-qty-btn:active { background: var(--border); }
  .ri-qty-num {
    width: 30px; height: 30px; display: flex; align-items: center; justify-content: center;
    font-family: var(--mono); font-size: 13px; font-weight: 700; color: var(--accent2);
    border-top: 1px solid var(--border); border-bottom: 1px solid var(--border);
    background: var(--surface);
  }
  .ri-precio { font-family: var(--mono); font-size: 12px; color: var(--muted); min-width: 52px; text-align: right; }
  /* Nota en drawer */
  .ri-nota-row { padding: 0 1rem 10px; display: flex; align-items: center; gap: 8px; }
  .ri-nota-input {
    flex: 1; background: var(--bg); border: 1px solid var(--border);
    border-radius: 8px; padding: 5px 10px; font-size: 13px; font-family: var(--sans);
    color: var(--text); outline: none; transition: border .15s;
  }
  .ri-nota-input:focus { border-color: var(--accent2); }
  .ri-nota-input::placeholder { color: var(--muted); }
  .ri-nota-label { font-size: 11px; color: var(--muted); white-space: nowrap; }

  .drawer-footer { padding: .75rem 1rem; border-top: 1px solid var(--border); flex-shrink: 0; display: flex; align-items: center; gap: 10px; }
  .drawer-total { font-family: var(--mono); font-size: 18px; font-weight: 500; flex: 1; }
  .btn-enviar-drawer { background: var(--accent); color: #fff; border: none; border-radius: 8px; padding: 10px 20px; font-family: var(--mono); font-size: 13px; font-weight: 500; cursor: pointer; }
  .btn-enviar-drawer:disabled { opacity: .3; cursor: default; }

  .loading { padding: 3rem 1rem; text-align: center; font-family: var(--mono); font-size: 13px; color: var(--muted); }

  /* TICKET */
  #view-ticket { display: none; padding: 1rem; }
  .ticket-card { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 1.5rem; max-width: 380px; margin: 0 auto; }
  .ticket-header { text-align: center; margin-bottom: 1rem; border-bottom: 1px dashed var(--border); padding-bottom: 1rem; }
  .ticket-mesa { font-family: var(--mono); font-size: 22px; font-weight: 500; }
  .ticket-fecha { font-size: 12px; color: var(--muted); margin-top: 4px; }
  .ticket-linea { display: flex; justify-content: space-between; padding: 6px 0; font-size: 14px; border-bottom: 1px solid var(--border); flex-wrap: wrap; gap: 2px; }
  .ticket-linea:last-of-type { border-bottom: none; }
  .ticket-nota { width: 100%; font-size: 11px; color: var(--muted); font-style: italic; }
  .ticket-total { display: flex; justify-content: space-between; font-family: var(--mono); font-size: 18px; font-weight: 500; margin-top: 1rem; padding-top: 1rem; border-top: 2px solid var(--accent); }
  .btn-print { width: 100%; margin-top: 1rem; background: var(--accent); color: #fff; border: none; border-radius: 8px; padding: 12px; font-family: var(--mono); font-size: 14px; cursor: pointer; }
  .btn-cerrar { width: 100%; margin-top: .5rem; background: none; color: var(--danger); border: 1px solid var(--danger); border-radius: 8px; padding: 10px; font-family: var(--mono); font-size: 13px; cursor: pointer; }

  @media print {
    body > * { display: none !important; }
    #view-ticket { display: block !important; }
    #view-ticket > div:first-child { display: none !important; }
    .ticket-card { border: none !important; border-radius: 0 !important; padding: 0 !important; max-width: 100% !important; }
    .btn-print, .btn-cerrar { display: none !important; }
  }
</style>
</head>
<body>

<div class="topbar">
  <span class="topbar-title">Camarero</span>
  <span class="mesa-badge" id="topbar-mesa"></span>
  <div class="spacer"></div>
  <button class="btn-carrito" id="btn-carrito" onclick="abrirDrawer()">
    🧾 <span id="carrito-label">0</span>
    <span class="carrito-count" id="carrito-count">0</span>
  </button>
</div>

<div id="view-mesas">
  <div style="padding:1rem 1rem .5rem"><div class="mesas-title">Selecciona una mesa</div></div>
  <div class="mesas-grid" id="mesas-grid" style="padding:0 1rem"><div class="loading">Cargando…</div></div>
</div>

<div id="view-carta">
  <div class="carta-scroll" id="carta-body"><div class="loading">Cargando carta…</div></div>
  <div class="bottom-bar">
    <button class="btn btn-back" onclick="volverMesas()">← Mesas</button>
    <div class="resumen-info">
      <div class="resumen-lineas" id="res-lineas">Sin artículos</div>
      <div class="resumen-total" id="res-total">0,00 €</div>
    </div>
    <button class="btn btn-cuenta" id="btn-cuenta" onclick="verCuenta()" style="display:none">Cuenta</button>
    <button class="btn btn-enviar" id="btn-enviar" disabled onclick="enviarPedido()">Enviar</button>
  </div>
</div>

<div id="view-ticket">
  <div style="display:flex;gap:10px;margin-bottom:1rem;align-items:center;padding:1rem 1rem 0">
    <button class="btn btn-back" onclick="show('carta')">← Volver</button>
    <span style="font-family:var(--mono);font-size:13px;color:var(--muted)">Cuenta</span>
  </div>
  <div style="padding:0 1rem"><div class="ticket-card" id="ticket-card"></div></div>
</div>

<!-- DRAWER -->
<div class="drawer-overlay" id="drawer-overlay" onclick="cerrarDrawer()"></div>
<div class="drawer" id="drawer">
  <div class="drawer-handle"></div>
  <div class="drawer-header">
    <span class="drawer-title" id="drawer-title">Pedido</span>
    <button class="drawer-close" onclick="cerrarDrawer()">×</button>
  </div>
  <div class="drawer-body" id="drawer-body"><div class="drawer-empty">Sin artículos aún</div></div>
  <div class="drawer-footer">
    <span class="drawer-total" id="drawer-total">0,00 €</span>
    <button class="btn-enviar-drawer" id="btn-enviar-drawer" disabled onclick="enviarPedido()">Enviar pedido</button>
  </div>
</div>

<iframe id="iframe-print" style="position:fixed;top:-9999px;left:-9999px;width:1px;height:1px;border:none"></iframe>

<script type="module">
import { db } from './firebase.js';
import { ref, onValue, push, set, remove, get }
  from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";

// carrito: artId → { art, qty, nota }
let mesaId = null, mesaNombre = null;
let carrito = {};
let mesasData = {}, cartaData = {}, categoriasData = {};
let cartaReady = false, catsReady = false;
let configLocal = {};

onValue(ref(db, 'mesas'), snap => { mesasData = snap.val() || {}; renderMesas(); });
onValue(ref(db, 'categorias'), snap => { categoriasData = snap.val() || {}; catsReady = true; if (cartaReady && mesaId) renderCarta(); });
onValue(ref(db, 'carta'), snap => { cartaData = snap.val() || {}; cartaReady = true; if (catsReady && mesaId) renderCarta(); });
onValue(ref(db, 'config/local'), snap => { configLocal = snap.val() || {}; });

// ── Mesas ─────────────────────────────────────────────────────────────────────
function renderMesas() {
  const grid = document.getElementById('mesas-grid');
  const entries = Object.entries(mesasData);
  if (!entries.length) { grid.innerHTML = '<div class="loading">Sin mesas.</div>'; return; }
  grid.innerHTML = '';
  entries.sort(([,a],[,b]) => a.nombre.localeCompare(b.nombre, 'es', {numeric:true}))
    .forEach(([id, m]) => {
      const ocupada = m.estado === 'ocupada';
      const div = document.createElement('div');
      div.className = 'mesa-btn' + (ocupada ? ' ocupada' : '');
      div.innerHTML = `<span class="mesa-nombre">${m.nombre}</span><span class="mesa-estado">${ocupada ? 'ocupada' : 'libre'}</span>`;
      div.addEventListener('click', () => abrirMesa(id, m.nombre, ocupada));
      grid.appendChild(div);
    });
}

function abrirMesa(id, nombre, ocupada) {
  mesaId = id; mesaNombre = nombre; carrito = {};
  document.getElementById('topbar-mesa').textContent = 'Mesa ' + nombre;
  document.getElementById('topbar-mesa').style.display = '';
  document.getElementById('btn-cuenta').style.display = ocupada ? '' : 'none';
  show('carta');
  if (cartaReady && catsReady) renderCarta();
  else document.getElementById('carta-body').innerHTML = '<div class="loading">Cargando carta…</div>';
  updateUI();
}

window.volverMesas = () => {
  mesaId = null; mesaNombre = null; carrito = {};
  document.getElementById('topbar-mesa').style.display = 'none';
  cerrarDrawer(); show('mesas');
};

// ── Carta ─────────────────────────────────────────────────────────────────────
function renderCarta() {
  const body = document.getElementById('carta-body');
  const cats = Object.entries(categoriasData).sort(([,a],[,b]) => a.nombre.localeCompare(b.nombre, 'es'));
  if (!cats.length) { body.innerHTML = '<div class="loading">Sin categorías.</div>'; return; }
  body.innerHTML = '';

  cats.forEach(([catId, cat]) => {
    const arts = Object.entries(cartaData)
      .filter(([,a]) => a.catId === catId)
      .sort(([,a],[,b]) => a.nombre.localeCompare(b.nombre, 'es'));
    if (!arts.length) return;

    const section = document.createElement('div');
    section.className = 'cat-section';
    section.id = 'cat-' + catId;

    const toggle = document.createElement('div');
    toggle.className = 'cat-toggle';
    toggle.innerHTML = `
      <span class="cat-nombre-label">${cat.nombre}</span>
      <span class="cat-count" id="catcount-${catId}"></span>
      <span class="cat-arrow">▾</span>`;
    toggle.addEventListener('click', () => toggleCat(section));
    section.appendChild(toggle);

    const itemsDiv = document.createElement('div');
    itemsDiv.className = 'cat-items';
    itemsDiv.style.maxHeight = '4000px';

    arts.forEach(([artId, art]) => {
      const wrap = document.createElement('div');
      wrap.className = 'art-row';

      // Fila principal
      const mainRow = document.createElement('div');
      mainRow.className = 'art-main';
      mainRow.innerHTML = `
        <span class="art-nombre">${art.nombre}</span>
        <span class="art-precio">${Number(art.precio).toFixed(2)} €</span>
        <div class="qty-ctrl">
          <button class="qty-btn" data-id="${artId}" data-d="-1">−</button>
          <span class="qty-num" id="qty-${artId}">0</span>
          <button class="qty-btn" data-id="${artId}" data-d="1">+</button>
        </div>`;
      wrap.appendChild(mainRow);

      // Fila nota (oculta hasta que qty > 0)
      const notaRow = document.createElement('div');
      notaRow.className = 'art-nota-row';
      notaRow.id = 'notarow-' + artId;
      notaRow.innerHTML = `
        <span class="nota-label">Nota:</span>
        <input class="nota-input" id="nota-${artId}" type="text"
          placeholder="ej: poco hecho, sin cebolla…"
          oninput="actualizarNota('${artId}', this.value)" />`;
      wrap.appendChild(notaRow);

      itemsDiv.appendChild(wrap);
    });

    section.appendChild(itemsDiv);
    body.appendChild(section);
  });

  body.onclick = e => {
    const btn = e.target.closest('[data-d]');
    if (!btn) return;
    cambiarQty(btn.dataset.id, parseInt(btn.dataset.d));
  };

  updateQtyDisplay();
  updateUI();
}

function toggleCat(section) {
  const items = section.querySelector('.cat-items');
  const collapsed = section.classList.toggle('collapsed');
  items.style.maxHeight = collapsed ? '0' : '4000px';
}

// ── Carrito ───────────────────────────────────────────────────────────────────
function cambiarQty(artId, delta) {
  const art = cartaData[artId];
  if (!art) return;
  const prev = carrito[artId]?.qty || 0;
  const nota = carrito[artId]?.nota || '';
  const next = Math.max(0, prev + delta);
  if (next === 0) delete carrito[artId];
  else carrito[artId] = { art, qty: next, nota };
  updateQtyDisplay();
  updateUI();
  if (document.getElementById('drawer').classList.contains('open')) renderDrawer();
}

window.actualizarNota = (artId, valor) => {
  if (carrito[artId]) {
    carrito[artId].nota = valor.trim();
    if (document.getElementById('drawer').classList.contains('open')) renderDrawer();
  }
};

function updateQtyDisplay() {
  Object.keys(cartaData).forEach(id => {
    const el = document.getElementById('qty-' + id);
    if (!el) return;
    const q = carrito[id]?.qty || 0;
    el.textContent = q;
    el.className = 'qty-num' + (q > 0 ? ' has-qty' : '');

    // mostrar/ocultar fila de nota
    const notaRow = document.getElementById('notarow-' + id);
    if (notaRow) {
      if (q > 0) {
        notaRow.classList.add('visible');
        // preservar el texto si ya existe
        const input = document.getElementById('nota-' + id);
        if (input && carrito[id]?.nota) input.value = carrito[id].nota;
      } else {
        notaRow.classList.remove('visible');
        const input = document.getElementById('nota-' + id);
        if (input) input.value = '';
      }
    }
  });

  // contador por categoría
  Object.entries(categoriasData).forEach(([catId]) => {
    const el = document.getElementById('catcount-' + catId);
    if (!el) return;
    const arts = Object.entries(cartaData).filter(([,a]) => a.catId === catId);
    const total = arts.reduce((s, [id]) => s + (carrito[id]?.qty || 0), 0);
    el.textContent = total > 0 ? total : '';
    el.classList.toggle('visible', total > 0);
  });
}

function updateUI() {
  const n = Object.keys(carrito).length;
  const totalUds = Object.values(carrito).reduce((s, {qty}) => s + qty, 0);
  const total = Object.values(carrito).reduce((s, {art, qty}) => s + Number(art.precio) * qty, 0);

  document.getElementById('res-lineas').textContent = n ? `${totalUds} ud${totalUds > 1 ? 's' : ''}` : 'Sin artículos';
  document.getElementById('res-total').textContent = total.toFixed(2).replace('.', ',') + ' €';
  document.getElementById('btn-enviar').disabled = n === 0;

  const btnC = document.getElementById('btn-carrito');
  if (n > 0) {
    btnC.classList.add('tiene');
    document.getElementById('carrito-count').textContent = totalUds;
    document.getElementById('carrito-label').textContent = total.toFixed(2).replace('.', ',') + ' €';
  } else {
    btnC.classList.remove('tiene');
  }

  document.getElementById('drawer-total').textContent = total.toFixed(2).replace('.', ',') + ' €';
  document.getElementById('btn-enviar-drawer').disabled = n === 0;
}

// ── Drawer ────────────────────────────────────────────────────────────────────
window.abrirDrawer = () => {
  renderDrawer();
  document.getElementById('drawer').classList.add('open');
  document.getElementById('drawer-overlay').classList.add('open');
};

window.cerrarDrawer = () => {
  document.getElementById('drawer').classList.remove('open');
  document.getElementById('drawer-overlay').classList.remove('open');
};

function renderDrawer() {
  const body = document.getElementById('drawer-body');
  document.getElementById('drawer-title').textContent = mesaNombre ? 'Mesa ' + mesaNombre : 'Pedido';

  const items = Object.entries(carrito);
  if (!items.length) { body.innerHTML = '<div class="drawer-empty">Sin artículos aún</div>'; return; }

  body.innerHTML = '';
  items.forEach(([artId, {art, qty, nota}]) => {
    const wrap = document.createElement('div');
    wrap.className = 'ri-wrap';

    // Fila principal con qty control
    const main = document.createElement('div');
    main.className = 'ri-main';
    main.innerHTML = `
      <span class="ri-nombre">${art.nombre}</span>
      <div class="ri-qty-ctrl">
        <button class="ri-qty-btn" data-rid="${artId}" data-rd="-1">−</button>
        <span class="ri-qty-num">${qty}</span>
        <button class="ri-qty-btn" data-rid="${artId}" data-rd="1">+</button>
      </div>
      <span class="ri-precio">${(Number(art.precio) * qty).toFixed(2)} €</span>`;
    wrap.appendChild(main);

    // Nota editable en drawer
    const notaRow = document.createElement('div');
    notaRow.className = 'ri-nota-row';
    notaRow.innerHTML = `
      <span class="ri-nota-label">Nota:</span>
      <input class="ri-nota-input" type="text"
        placeholder="ej: poco hecho, sin cebolla…"
        value="${nota || ''}"
        data-rnota="${artId}" />`;
    wrap.appendChild(notaRow);

    body.appendChild(wrap);
  });

  // Qty +/- en drawer
  body.addEventListener('click', e => {
    const btn = e.target.closest('[data-rd]');
    if (!btn) return;
    const artId = btn.dataset.rid;
    const delta = parseInt(btn.dataset.rd);
    cambiarQty(artId, delta);
    // sincronizar qty display en carta también
    const notaInput = document.getElementById('nota-' + artId);
    if (notaInput && carrito[artId]) notaInput.value = carrito[artId].nota || '';
  }, { once: false });

  // Nota en drawer → sincroniza con carrito y carta
  body.addEventListener('input', e => {
    const input = e.target.closest('[data-rnota]');
    if (!input) return;
    const artId = input.dataset.rnota;
    if (carrito[artId]) {
      carrito[artId].nota = input.value.trim();
      // sincronizar campo nota en la carta si existe
      const cartaInput = document.getElementById('nota-' + artId);
      if (cartaInput) cartaInput.value = input.value;
    }
  });
}

// ── Enviar ────────────────────────────────────────────────────────────────────
// ── Impresión comanda via iframe ───────────────────────────────────────────────
function imprimirComanda(nombreMesa, lineas, configLocal) {
  const fecha = new Date().toLocaleTimeString('es-ES', {hour:'2-digit', minute:'2-digit'});
  const rows = lineas.map(l => `
    <tr>
      <td style="padding:4px 6px 4px 0;font-weight:bold;vertical-align:top;white-space:nowrap">${l.qty}×</td>
      <td style="padding:4px 0;vertical-align:top">
        ${l.nombre}
        ${l.nota ? `<br><span style="font-size:11px;color:#555">↳ ${l.nota}</span>` : ''}
      </td>
      <td style="padding:4px 0 4px 8px;text-align:right;vertical-align:top;white-space:nowrap">${(l.precio*l.qty).toFixed(2)}€</td>
    </tr>`).join('');

  const localHeader = configLocal?.nombre
    ? `<div style="font-weight:bold;font-size:14px">${configLocal.nombre}</div>
       ${configLocal.direccion ? `<div>${configLocal.direccion}</div>` : ''}` : '';

  const html = `<!DOCTYPE html><html><head><meta charset="UTF-8">
    <style>
      *{box-sizing:border-box;margin:0;padding:0}
      body{font-family:monospace;font-size:13px;padding:8px;width:100%}
      .local{font-size:11px;color:#666;margin-bottom:8px;border-bottom:1px dashed #ccc;padding-bottom:6px}
      h2{font-size:15px;font-weight:bold;margin-bottom:2px}
      .sub{font-size:11px;color:#666;margin-bottom:10px}
      table{width:100%;border-collapse:collapse}
      tr{border-bottom:1px solid #eee}
      tr:last-child{border-bottom:none}
    </style></head><body>
    ${localHeader ? `<div class="local">${localHeader}</div>` : ''}
    <h2>Mesa ${nombreMesa}</h2>
    <div class="sub">${fecha}</div>
    <table>${rows}</table>
    </body></html>`;

  const iframe = document.getElementById('iframe-print');
  iframe.srcdoc = html;
  iframe.onload = () => {
    try { iframe.contentWindow.focus(); iframe.contentWindow.print(); }
    catch(e) {}
  };
}

// ── Enviar ────────────────────────────────────────────────────────────────────
window.enviarPedido = async () => {
  if (!mesaId || !Object.keys(carrito).length) return;
  const btn1 = document.getElementById('btn-enviar');
  const btn2 = document.getElementById('btn-enviar-drawer');
  btn1.disabled = true; btn1.textContent = '…';
  btn2.disabled = true; btn2.textContent = '…';

  await set(ref(db, 'mesas/' + mesaId + '/estado'), 'ocupada');
  document.getElementById('btn-cuenta').style.display = '';

  const lineasImprimir = [];
  for (const [artId, {art, qty, nota}] of Object.entries(carrito)) {
    await push(ref(db, 'pedidos/' + mesaId), {
      artId, nombre: art.nombre, precio: Number(art.precio),
      qty, destino: art.destino, estado: 'pendiente',
      nota: nota || '', ts: Date.now()
    });
    lineasImprimir.push({ nombre: art.nombre, precio: Number(art.precio), qty, nota: nota || '' });
  }

  // Imprimir comanda automáticamente
  imprimirComanda(mesaNombre, lineasImprimir, configLocal);

  carrito = {};
  cerrarDrawer();
  updateQtyDisplay();
  updateUI();
  btn1.textContent = '✓ Enviado'; btn1.disabled = false;
  btn2.textContent = 'Enviar pedido';
  setTimeout(() => { btn1.textContent = 'Enviar'; updateUI(); }, 1800);
};

// ── Cuenta ────────────────────────────────────────────────────────────────────
window.verCuenta = async () => {
  if (!mesaId) return;
  const snap = await get(ref(db, 'pedidos/' + mesaId));
  const pedidos = snap.val() || {};
  const agrupado = {};
  Object.values(pedidos).forEach(l => {
    const k = l.nombre + (l.nota ? '|' + l.nota : '');
    if (!agrupado[k]) agrupado[k] = { nombre: l.nombre, precio: Number(l.precio), qty: 0, nota: l.nota || '' };
    agrupado[k].qty += l.qty;
  });
  const total = Object.values(agrupado).reduce((s, l) => s + l.precio * l.qty, 0);
  const fecha = new Date().toLocaleString('es-ES', { dateStyle: 'short', timeStyle: 'short' });

  const loc = configLocal;
  const cabecera = `
    ${loc.nombre    ? `<div style="font-size:18px;font-weight:500;font-family:var(--mono)">${loc.nombre}</div>` : ''}
    ${loc.direccion ? `<div style="font-size:12px;color:var(--muted);margin-top:2px">${loc.direccion}</div>` : ''}
    ${loc.telefono  ? `<div style="font-size:12px;color:var(--muted)">${loc.telefono}</div>` : ''}
    ${loc.cif       ? `<div style="font-size:11px;color:var(--muted)">${loc.cif}</div>` : ''}
  `;
  const pie = loc.footer
    ? `<div style="text-align:center;font-size:12px;color:var(--muted);margin-top:1rem;padding-top:.75rem;border-top:1px dashed var(--border)">${loc.footer}</div>`
    : '';

  document.getElementById('ticket-card').innerHTML = `
    <div class="ticket-header">
      ${cabecera}
      <div style="margin-top:${loc.nombre ? '.75rem' : '0'}">
        <div class="ticket-mesa">Mesa ${mesaNombre}</div>
        <div class="ticket-fecha">${fecha}</div>
      </div>
    </div>
    ${Object.values(agrupado).map(l => `
      <div class="ticket-linea">
        <span>${l.qty}× ${l.nombre}</span>
        <span style="font-family:var(--mono)">${(l.precio * l.qty).toFixed(2)} €</span>
      </div>`).join('')}
    <div class="ticket-total"><span>Total</span><span>${total.toFixed(2)} €</span></div>
    ${pie}
    <button class="btn-print" onclick="window.print()">Imprimir ticket</button>
    <button class="btn-cerrar" onclick="cerrarMesa()">Cerrar mesa y limpiar</button>
  `;
  show('ticket');
};

window.cerrarMesa = async () => {
  if (!confirm('¿Cerrar mesa ' + mesaNombre + '?')) return;
  await remove(ref(db, 'pedidos/' + mesaId));
  await set(ref(db, 'mesas/' + mesaId + '/estado'), 'libre');
  mesaId = null; mesaNombre = null; carrito = {};
  document.getElementById('topbar-mesa').style.display = 'none';
  show('mesas');
};

window.show = v => {
  document.getElementById('view-mesas').style.display  = v === 'mesas'  ? 'block' : 'none';
  document.getElementById('view-carta').style.display  = v === 'carta'  ? 'block' : 'none';
  document.getElementById('view-ticket').style.display = v === 'ticket' ? 'block' : 'none';
};
</script>
