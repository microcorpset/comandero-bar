<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>🍽️ Comandero · Camarero</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Outfit:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg:#f5f3ee; --surface:#fff; --surface2:#ede9e0; --border:#ddd9d0;
    --accent:#1a1a1a; --accent2:#3d7aff; --danger:#e53535;
    --warn:#d97706; --text:#1a1a1a; --muted:#9a9489;
    --mono:'DM Mono',monospace; --sans:'Outfit',sans-serif;
    --radius:14px; --shadow:0 2px 12px rgba(0,0,0,.06);
  }
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  body{background:var(--bg);color:var(--text);font-family:var(--sans);min-height:100vh;overflow-x:hidden}

  /* PIN */
  #pin-screen{position:fixed;inset:0;z-index:200;background:var(--accent);display:flex;align-items:center;justify-content:center;flex-direction:column}
  #pin-screen::before{content:'';position:absolute;inset:0;pointer-events:none;background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='1'/%3E%3C/svg%3E");opacity:.04;background-size:200px}
  .pin-box{position:relative;z-index:1;display:flex;flex-direction:column;align-items:center;gap:1.5rem;width:280px}
  .pin-logo{display:flex;align-items:center;gap:.6rem;margin-bottom:.25rem}
  .pin-logo-icon{width:42px;height:42px;border-radius:10px;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.15);display:flex;align-items:center;justify-content:center;font-size:20px}
  .pin-title{font-family:var(--mono);font-size:18px;font-weight:500;color:#fff;letter-spacing:-.5px}
  .pin-sub{font-size:13px;color:rgba(255,255,255,.45);text-align:center;font-weight:300;margin-top:-.75rem}
  .pin-dots{display:flex;gap:12px}
  .pin-dot{width:12px;height:12px;border-radius:50%;border:2px solid rgba(255,255,255,.25);background:transparent;transition:background .15s,border-color .15s,transform .15s}
  .pin-dot.filled{background:#fff;border-color:#fff;transform:scale(1.1)}
  .pin-dot.error{background:#ff6b6b;border-color:#ff6b6b}
  .pin-pad{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;width:100%}
  .pin-key{height:58px;border-radius:12px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.1);font-family:var(--mono);font-size:20px;font-weight:500;color:#fff;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:background .1s,transform .1s}
  .pin-key:active{background:rgba(255,255,255,.2);transform:scale(.94)}
  .pin-key.del{font-size:16px;color:rgba(255,255,255,.6)}
  .pin-key.empty{background:none;border:none;cursor:default}
  .pin-error-msg{font-family:var(--mono);font-size:12px;color:#ff6b6b;display:none;letter-spacing:.02em}

  /* MODAL */
  .modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:100;align-items:center;justify-content:center;padding:1rem;backdrop-filter:blur(4px)}
  .modal-overlay.open{display:flex}
  .modal-box{background:var(--surface);border:1px solid var(--border);border-radius:20px;padding:1.75rem 1.5rem;width:100%;max-width:320px;display:flex;flex-direction:column;gap:1rem;box-shadow:0 24px 80px rgba(0,0,0,.18);animation:modal-in .2s cubic-bezier(.34,1.56,.64,1)}
  @keyframes modal-in{from{opacity:0;transform:scale(.92) translateY(12px)}to{opacity:1;transform:none}}
  .modal-title{font-family:var(--mono);font-size:15px;font-weight:500}
  .modal-body{font-size:14px;color:var(--muted);line-height:1.55}
  .modal-actions{display:flex;gap:8px;justify-content:flex-end}
  .modal-btn{padding:9px 18px;border-radius:10px;font-family:var(--mono);font-size:13px;cursor:pointer;border:1px solid var(--border);background:var(--surface2);color:var(--text);transition:background .15s}
  .modal-btn:hover{background:var(--border)}
  .modal-btn.primary{background:var(--accent);color:#fff;border-color:var(--accent)}
  .modal-btn.danger{background:var(--danger);color:#fff;border-color:var(--danger)}

  /* TOPBAR */
  .topbar{background:rgba(255,255,255,.88);backdrop-filter:blur(14px);border-bottom:1px solid var(--border);padding:0 1rem;height:54px;display:flex;align-items:center;gap:10px;position:sticky;top:0;z-index:40}
  .topbar-logo{font-size:20px}
  .topbar-title{font-family:var(--mono);font-size:14px;font-weight:500;letter-spacing:-.3px}
  .mesa-badge{background:var(--accent);color:#fff;font-family:var(--mono);font-size:12px;padding:3px 10px;border-radius:20px;display:none;font-weight:500}
  .spacer{flex:1}
  .btn-carrito{background:none;border:1.5px solid var(--border);border-radius:10px;padding:5px 11px;cursor:pointer;font-family:var(--mono);font-size:12px;color:var(--text);display:none;align-items:center;gap:6px;transition:border-color .15s}
  .btn-carrito.tiene{border-color:var(--accent2);color:var(--accent2);display:flex}
  .carrito-count{background:var(--accent2);color:#fff;border-radius:20px;font-size:10px;padding:1px 6px;font-weight:600}
  .print-toggle{display:flex;align-items:center;gap:5px;cursor:pointer;font-family:var(--mono);font-size:10px;color:var(--muted);flex-shrink:0}
  .toggle-track{width:30px;height:17px;border-radius:9px;background:var(--border);position:relative;transition:background .2s;flex-shrink:0}
  .toggle-track.on{background:var(--accent)}
  .toggle-thumb{width:13px;height:13px;border-radius:50%;background:#fff;position:absolute;top:2px;left:2px;transition:left .2s;box-shadow:0 1px 3px rgba(0,0,0,.2)}
  .toggle-track.on .toggle-thumb{left:15px}
  .quota-badge{display:none;font-family:var(--mono);font-size:10px;padding:3px 9px;border-radius:20px;border:1px solid;white-space:nowrap;flex-shrink:0}
  #topbar-camarero{font-family:var(--mono);font-size:10px;color:var(--muted);flex-shrink:0}

  /* MESAS */
  #view-mesas{padding:1rem}
  .mesas-title{font-family:var(--mono);font-size:10px;color:var(--muted);letter-spacing:.1em;text-transform:uppercase;margin-bottom:.75rem}
  .mesas-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(88px,1fr));gap:10px}
  .mesa-btn{min-height:88px;background:var(--surface);border:1.5px solid var(--border);border-radius:var(--radius);display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;transition:border .2s,background .2s,box-shadow .2s,transform .15s;gap:3px;padding:10px 8px;box-shadow:var(--shadow)}
  .mesa-btn:active{transform:scale(.95)}
  .mesa-btn.ocupada{border-color:var(--accent2);background:rgba(61,122,255,.04);box-shadow:0 2px 12px rgba(61,122,255,.1)}
  .mesa-btn.alerta-ok{border-color:#22c55e;background:rgba(34,197,94,.04)}
  .mesa-btn.alerta-warn{border-color:var(--warn);background:rgba(217,119,6,.05)}
  .mesa-btn.alerta-danger{border-color:var(--danger);background:rgba(229,53,53,.05)}
  .mesa-nombre{font-family:var(--mono);font-size:17px;font-weight:500}
  .mesa-estado{font-size:10px;color:var(--muted);font-weight:400}
  .mesa-btn.ocupada .mesa-estado{color:var(--accent2);font-weight:500}
  .mesa-alerta-info{font-size:9px;display:flex;align-items:center;gap:2px;color:var(--muted);margin-top:1px}

  /* CARTA */
  #view-carta{display:none}
  .carta-scroll{padding-bottom:100px}
  .cat-toggle{display:flex;align-items:center;gap:10px;padding:10px 1rem;background:var(--bg);cursor:pointer;position:sticky;top:54px;z-index:5;border-bottom:1px solid var(--border);user-select:none;transition:background .1s}
  .cat-toggle:active{background:var(--surface2)}
  .cat-nombre-label{font-family:var(--mono);font-size:10px;font-weight:500;color:var(--muted);letter-spacing:.08em;text-transform:uppercase;flex:1}
  .cat-count{font-family:var(--mono);font-size:10px;color:var(--accent2);background:rgba(61,122,255,.1);padding:2px 8px;border-radius:20px;display:none;font-weight:500}
  .cat-count.visible{display:inline}
  .cat-arrow{font-size:11px;color:var(--muted);transition:transform .2s}
  .cat-section.collapsed .cat-arrow{transform:rotate(-90deg)}
  .cat-items{overflow:hidden;transition:max-height .25s ease}
  .cat-section.collapsed .cat-items{max-height:0 !important}
  .art-row{background:var(--surface);border-bottom:1px solid var(--border)}
  .art-row:last-child{border-bottom:none}
  .art-main{display:flex;align-items:center;gap:10px;padding:11px 1rem;user-select:none}
  .art-nombre{flex:1;font-size:15px;line-height:1.3}
  .art-precio{font-family:var(--mono);font-size:13px;color:var(--muted);white-space:nowrap}
  .qty-ctrl{display:flex;align-items:center;flex-shrink:0}
  .qty-btn{width:34px;height:34px;border:1px solid var(--border);background:var(--surface2);font-size:20px;cursor:pointer;display:flex;align-items:center;justify-content:center;color:var(--text);transition:background .1s}
  .qty-btn:first-child{border-radius:8px 0 0 8px}
  .qty-btn:last-child{border-radius:0 8px 8px 0}
  .qty-btn:active{background:var(--border)}
  .qty-num{width:34px;height:34px;display:flex;align-items:center;justify-content:center;font-family:var(--mono);font-size:14px;font-weight:600;border-top:1px solid var(--border);border-bottom:1px solid var(--border);background:var(--surface);color:var(--muted)}
  .qty-num.has-qty{color:var(--accent2);background:rgba(61,122,255,.06)}
  .btn-nota{width:34px;height:34px;border:1px solid var(--border);background:var(--surface2);border-radius:8px;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:13px;transition:background .1s,border-color .1s;flex-shrink:0}
  .btn-nota:active{background:var(--border)}
  .btn-nota.tiene-nota{border-color:var(--accent2);background:rgba(61,122,255,.08)}

  /* BOTTOM BAR */
  .bottom-bar{position:fixed;bottom:0;left:0;right:0;background:rgba(255,255,255,.9);backdrop-filter:blur(12px);border-top:1px solid var(--border);padding:.75rem 1rem;display:flex;align-items:center;gap:10px;z-index:30}
  .btn{border-radius:10px;padding:9px 16px;font-family:var(--mono);font-size:13px;cursor:pointer;transition:opacity .15s,background .15s;white-space:nowrap;border:1px solid var(--border)}
  .btn-back{background:none;color:var(--text)}
  .btn-back:active{background:var(--surface2)}
  .btn-cuenta{background:none;color:var(--accent2);border-color:rgba(61,122,255,.4)}
  .btn-enviar{background:var(--accent);color:#fff;border-color:var(--accent);font-weight:600}
  .btn-enviar:disabled{opacity:.25;cursor:default}
  .resumen-info{flex:1;min-width:0}
  .resumen-lineas{font-family:var(--mono);font-size:10px;color:var(--muted)}
  .resumen-total{font-family:var(--mono);font-size:18px;font-weight:600;letter-spacing:-.5px}

  /* DRAWER */
  .drawer-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:50;backdrop-filter:blur(3px)}
  .drawer-overlay.open{display:block}
  .drawer{position:fixed;bottom:0;left:0;right:0;background:var(--surface);border-radius:20px 20px 0 0;border-top:1px solid var(--border);z-index:51;transform:translateY(100%);transition:transform .3s cubic-bezier(.4,0,.2,1);max-height:82vh;display:flex;flex-direction:column}
  .drawer.open{transform:translateY(0)}
  .drawer-handle{width:36px;height:4px;background:var(--border);border-radius:2px;margin:12px auto 0;flex-shrink:0}
  .drawer-header{display:flex;align-items:center;gap:10px;padding:12px 1rem 10px;border-bottom:1px solid var(--border);flex-shrink:0}
  .drawer-title{font-family:var(--mono);font-size:14px;font-weight:500;flex:1}
  .drawer-close{background:none;border:none;font-size:22px;cursor:pointer;color:var(--muted);padding:0 4px;line-height:1}
  .drawer-body{overflow-y:auto;flex:1}
  .drawer-empty{padding:2.5rem 1rem;text-align:center;font-family:var(--mono);font-size:13px;color:var(--muted)}
  .ri-wrap{border-bottom:1px solid var(--border)}
  .ri-wrap:last-child{border-bottom:none}
  .ri-main{display:flex;align-items:center;gap:8px;padding:10px 1rem 6px}
  .ri-nombre{flex:1;font-size:14px}
  .ri-qty-ctrl{display:flex;align-items:center;flex-shrink:0}
  .ri-qty-btn{width:28px;height:28px;border:1px solid var(--border);background:var(--surface2);font-size:16px;cursor:pointer;display:flex;align-items:center;justify-content:center;color:var(--text);transition:background .1s}
  .ri-qty-btn:first-child{border-radius:6px 0 0 6px}
  .ri-qty-btn:last-child{border-radius:0 6px 6px 0}
  .ri-qty-btn:active{background:var(--border)}
  .ri-qty-num{width:28px;height:28px;display:flex;align-items:center;justify-content:center;font-family:var(--mono);font-size:12px;font-weight:700;color:var(--accent2);border-top:1px solid var(--border);border-bottom:1px solid var(--border);background:var(--surface)}
  .ri-precio{font-family:var(--mono);font-size:12px;color:var(--muted);min-width:50px;text-align:right}
  .ri-nota-row{padding:0 1rem 10px;display:flex;align-items:center;gap:8px}
  .ri-nota-input{flex:1;background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:5px 10px;font-size:13px;font-family:var(--sans);color:var(--text);outline:none;transition:border .15s}
  .ri-nota-input:focus{border-color:var(--accent2)}
  .ri-nota-input::placeholder{color:var(--muted)}
  .ri-nota-label{font-size:11px;color:var(--muted);white-space:nowrap}
  .drawer-footer{padding:.75rem 1rem;border-top:1px solid var(--border);flex-shrink:0;display:flex;align-items:center;gap:10px}
  .drawer-total{font-family:var(--mono);font-size:18px;font-weight:600;flex:1;letter-spacing:-.5px}
  .btn-enviar-drawer{background:var(--accent);color:#fff;border:none;border-radius:10px;padding:10px 20px;font-family:var(--mono);font-size:13px;font-weight:600;cursor:pointer}
  .btn-enviar-drawer:disabled{opacity:.25;cursor:default}

  .loading{padding:3rem 1rem;text-align:center;font-family:var(--mono);font-size:13px;color:var(--muted)}

  /* TICKET */
  #view-ticket{display:none;padding:1rem}
  .ticket-card{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:1.5rem;max-width:380px;margin:0 auto;box-shadow:var(--shadow)}
  .ticket-header{text-align:center;margin-bottom:1rem;border-bottom:1px dashed var(--border);padding-bottom:1rem}
  .ticket-mesa{font-family:var(--mono);font-size:22px;font-weight:500}
  .ticket-fecha{font-size:12px;color:var(--muted);margin-top:4px}
  .ticket-linea{display:flex;justify-content:space-between;padding:7px 0;font-size:14px;border-bottom:1px solid var(--border);flex-wrap:wrap;gap:2px;align-items:center}
  .ticket-linea:last-of-type{border-bottom:none}
  .ticket-nota{width:100%;font-size:11px;color:var(--muted);font-style:italic}
  .ticket-total{display:flex;justify-content:space-between;font-family:var(--mono);font-size:20px;font-weight:600;margin-top:1rem;padding-top:1rem;border-top:2px solid var(--accent);letter-spacing:-.5px}
  .btn-print{width:100%;margin-top:1rem;background:var(--accent);color:#fff;border:none;border-radius:10px;padding:12px;font-family:var(--mono);font-size:14px;cursor:pointer;font-weight:500}
  .btn-cerrar{width:100%;margin-top:.5rem;background:none;color:var(--danger);border:1px solid rgba(229,53,53,.3);border-radius:10px;padding:10px;font-family:var(--mono);font-size:13px;cursor:pointer}
  .ticket-edit-hint{font-size:11px;color:var(--muted);margin-bottom:.75rem;font-family:var(--mono);background:var(--surface2);border-radius:8px;padding:6px 10px;text-align:center}
  .btn-quitar-linea{background:none;border:none;color:var(--danger);font-size:20px;cursor:pointer;padding:0 4px;line-height:1;flex-shrink:0;opacity:.6}
  .btn-quitar-linea:active{opacity:1}
  .ticket-linea-edit{display:flex;align-items:center;gap:8px}

  /* FAB acceso rápido barra/cocina */
  .fab-wrap{position:fixed;right:1rem;bottom:90px;z-index:29;display:none;flex-direction:column;align-items:flex-end;gap:8px}
  .fab-wrap.visible{display:flex}
  .fab-item{display:flex;align-items:center;gap:8px;text-decoration:none;opacity:0;transform:translateX(16px) scale(.9);transition:opacity .2s,transform .2s,box-shadow .2s}
  .fab-wrap.open .fab-item{opacity:1;transform:none}
  .fab-wrap.open .fab-item:nth-child(1){transition-delay:.06s}
  .fab-wrap.open .fab-item:nth-child(2){transition-delay:.12s}
  .fab-label{background:var(--accent);color:#fff;font-family:var(--mono);font-size:11px;font-weight:500;padding:5px 10px;border-radius:8px;box-shadow:0 4px 12px rgba(0,0,0,.15);white-space:nowrap}
  .fab-btn{width:42px;height:42px;border-radius:50%;border:none;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:18px;box-shadow:0 4px 14px rgba(0,0,0,.18);flex-shrink:0;transition:transform .15s}
  .fab-btn:active{transform:scale(.88)}
  .fab-barra{background:#ff8c42}
  .fab-cocina{background:#1a1a1a}
  .fab-trigger{width:46px;height:46px;border-radius:50%;border:2px solid var(--border);cursor:pointer;background:var(--surface);color:var(--text);display:flex;align-items:center;justify-content:center;font-size:18px;box-shadow:0 4px 16px rgba(0,0,0,.12);transition:transform .25s,background .2s,border-color .2s;flex-shrink:0}
  .fab-trigger:active{transform:scale(.9)}
  .fab-trigger.open{transform:rotate(45deg);background:var(--accent);color:#fff;border-color:var(--accent)}

  @media print {
    body>*{display:none !important}
    #view-ticket{display:block !important;padding:0 !important;margin:0 !important}
    #view-ticket>div:first-child{display:none !important}
    #view-ticket>div:last-child{padding:0 !important;margin:0 !important}
    .ticket-card{border:none !important;border-radius:0 !important;padding:0 !important;margin:0 !important;max-width:100% !important;box-shadow:none !important;background:transparent !important}
    .btn-print,.btn-cerrar,.ticket-edit-hint,.btn-quitar-linea{display:none !important}
    body{margin:0 !important;padding:0 !important;background:white !important}
  }
</style>
</head>
<body>

<!-- PIN SCREEN -->
<div id="pin-screen">
  <div class="pin-box">
    <div class="pin-logo">
      <div class="pin-logo-icon">🍽️</div>
      <div class="pin-title">Comandero</div>
    </div>
    <div class="pin-sub" id="pin-sub">Introduce tu PIN</div>
    <div class="pin-dots">
      <div class="pin-dot" id="pd0"></div>
      <div class="pin-dot" id="pd1"></div>
      <div class="pin-dot" id="pd2"></div>
      <div class="pin-dot" id="pd3"></div>
    </div>
    <div class="pin-error-msg" id="pin-error">PIN incorrecto</div>
    <div class="pin-pad" id="pin-pad">
      <button class="pin-key" data-k="1">1</button>
      <button class="pin-key" data-k="2">2</button>
      <button class="pin-key" data-k="3">3</button>
      <button class="pin-key" data-k="4">4</button>
      <button class="pin-key" data-k="5">5</button>
      <button class="pin-key" data-k="6">6</button>
      <button class="pin-key" data-k="7">7</button>
      <button class="pin-key" data-k="8">8</button>
      <button class="pin-key" data-k="9">9</button>
      <button class="pin-key empty" data-k=""></button>
      <button class="pin-key" data-k="0">0</button>
      <button class="pin-key del" data-k="del">⌫</button>
    </div>
  </div>
</div>

<!-- MODAL -->
<div class="modal-overlay" id="modal-overlay">
  <div class="modal-box" id="modal-box">
    <div class="modal-title" id="modal-title"></div>
    <div class="modal-body" id="modal-body"></div>
    <div class="modal-actions" id="modal-actions"></div>
  </div>
</div>

<div class="topbar">
  <span class="topbar-logo">🍽️</span>
  <span class="topbar-title">Comandero</span>
  <span class="mesa-badge" id="topbar-mesa"></span>
  <span id="topbar-camarero"></span>
  <div class="spacer"></div>
  <label class="print-toggle" title="Pantalla siempre encendida">
    <div class="toggle-track" id="wake-track"><div class="toggle-thumb"></div></div>
    <span>☀</span>
  </label>
  <label class="print-toggle" title="Generar PDF al enviar">
    <div class="toggle-track" id="print-track"><div class="toggle-thumb"></div></div>
    <span>PDF</span>
  </label>
  <label class="print-toggle" title="Generar TXT para autoimpresión">
    <div class="toggle-track" id="txt-track"><div class="toggle-thumb"></div></div>
    <span>TXT</span>
  </label>
  <span class="quota-badge" id="quota-badge"></span>
  <button class="btn-carrito" id="btn-carrito" onclick="abrirDrawer()">
    🧾 <span id="carrito-label">0</span>
    <span class="carrito-count" id="carrito-count">0</span>
  </button>
</div>

<!-- FAB acceso rápido barra/cocina -->
<div class="fab-wrap" id="fab-wrap">
  <a class="fab-item" href="barra.html">
    <span class="fab-label">🍺 Barra</span>
    <button class="fab-btn fab-barra">🍺</button>
  </a>
  <a class="fab-item" href="cocina.html">
    <span class="fab-label">🍳 Cocina</span>
    <button class="fab-btn fab-cocina">🍳</button>
  </a>
  <button class="fab-trigger" id="fab-trigger" onclick="toggleFab()">＋</button>
</div>

<div id="view-mesas">
  <div style="padding:1rem 1rem .5rem"><div class="mesas-title">Selecciona una mesa</div></div>
  <div class="mesas-grid" id="mesas-grid" style="padding:0 1rem"><div class="loading">Cargando…</div></div>
</div>

<div id="view-carta">
  <div class="carta-scroll" id="carta-body"><div class="loading">Cargando carta…</div></div>

  <!-- Botón flotante categorías -->
  <button id="btn-cats" onclick="toggleCatsPanel()"
    style="position:fixed;left:1rem;bottom:88px;z-index:25;background:var(--accent);
    color:#fff;border:none;border-radius:50%;width:44px;height:44px;font-size:18px;
    cursor:pointer;box-shadow:0 4px 16px rgba(0,0,0,.18);display:none;
    align-items:center;justify-content:center">☰</button>
  <div id="cats-panel"
    style="display:none;position:fixed;left:1rem;bottom:140px;z-index:26;
    background:var(--surface);border:1px solid var(--border);border-radius:12px;
    box-shadow:0 8px 32px rgba(0,0,0,.15);min-width:170px;overflow:hidden;
    max-height:60vh;overflow-y:auto"></div>

  <div class="bottom-bar">
    <button class="btn btn-back" onclick="volverMesas()">← Mesas</button>
    <div class="resumen-info">
      <div class="resumen-lineas" id="res-lineas">Sin artículos</div>
      <div class="resumen-total" id="res-total">0,00 €</div>
    </div>
    <button class="btn btn-cuenta" id="btn-cuenta" onclick="verCuenta()" style="display:none">Cuenta</button>
    <button class="btn btn-enviar" id="btn-enviar" disabled onclick="enviarPedido()">Enviar</button>
  </div>
</div>

<div id="view-ticket">
  <div style="display:flex;gap:10px;margin-bottom:1rem;align-items:center;padding:1rem 1rem 0">
    <button class="btn btn-back" onclick="show('carta')">← Volver</button>
    <span style="font-family:var(--mono);font-size:13px;color:var(--muted)">Cuenta</span>
  </div>
  <div style="padding:0 1rem"><div class="ticket-card" id="ticket-card"></div></div>
</div>

<!-- DRAWER -->
<div class="drawer-overlay" id="drawer-overlay" onclick="cerrarDrawer()"></div>
<div class="drawer" id="drawer">
  <div class="drawer-handle"></div>
  <div class="drawer-header">
    <span class="drawer-title" id="drawer-title">Pedido</span>
    <button class="drawer-close" onclick="cerrarDrawer()">×</button>
  </div>
  <div class="drawer-body" id="drawer-body"><div class="drawer-empty">Sin artículos aún</div></div>
  <div class="drawer-footer">
    <span class="drawer-total" id="drawer-total">0,00 €</span>
    <button class="btn-enviar-drawer" id="btn-enviar-drawer" disabled onclick="enviarPedido()">Enviar pedido</button>
  </div>
</div>

<script type="module" src="camarero.js"></script>
</body>
</html>
