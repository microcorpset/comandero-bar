<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#111a2e">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Camarero">
<link rel="icon" type="image/png" sizes="192x192" href="../icons/camarero-192.png">
<link rel="apple-touch-icon" href="../icons/camarero-180.png">
<title>Comandero 2.7 - Camarero</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=DM+Sans:wght@300;400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#eef2f8;
    --bg-soft:#dfe6f1;
    --surface:rgba(255,255,255,.9);
    --accent:#111a2e;
    --mono:'DM Mono',monospace;
    --sans:'DM Sans',sans-serif;
  }
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  html, body {
    overscroll-behavior-y: contain !important;
    height: 100%;
  }
  body{
    min-height:100vh;
    overflow:hidden;
    background:
      radial-gradient(circle at 12% 14%, rgba(216,255,97,.16), transparent 24%),
      radial-gradient(circle at 86% 10%, rgba(61,122,255,.14), transparent 24%),
      linear-gradient(180deg, var(--bg) 0%, color-mix(in srgb, var(--bg) 74%, var(--bg-soft) 26%) 100%);
    color:#172038;
    font-family:var(--sans);
  }

  #pin-screen{
    position:fixed; inset:0; z-index:200;
    background:
      radial-gradient(circle at top left, rgba(216,255,97,.18), transparent 24%),
      linear-gradient(180deg, #0a1120 0%, #0d1529 100%);
    display:flex; align-items:center; justify-content:center; padding:1rem;
  }
  .pin-box{
    width:min(360px, 100%);
    border:1px solid rgba(182,196,255,.12);
    border-radius:28px;
    background:linear-gradient(180deg, rgba(20,29,55,.96), rgba(11,16,30,.96));
    box-shadow:0 28px 90px rgba(0,0,0,.38);
    padding:2rem 1.6rem;
    display:flex; flex-direction:column; align-items:center; gap:1.25rem;
    transition: transform 0.2s ease;
  }
  .pin-logo{display:flex; align-items:center; gap:.7rem; margin-bottom:.2rem}
  .pin-logo-icon{
    width:50px; height:50px; border-radius:16px;
    background:rgba(255,255,255,.06);
    border:1px solid rgba(255,255,255,.12);
    display:flex; align-items:center; justify-content:center; font-size:22px;
  }
  .pin-title{font-family:var(--mono); font-size:20px; color:#fff; letter-spacing:-.05em}
  .pin-sub{font-size:13px; color:rgba(255,255,255,.55); text-align:center; margin-top:-.55rem}
  .pin-dots{display:flex; gap:12px}
  .pin-dot{
    width:13px; height:13px; border-radius:50%;
    border:2px solid rgba(255,255,255,.22); background:transparent;
    transition:background .15s,border-color .15s,transform .15s;
  }
  .pin-dot.filled{background:#fff;border-color:#fff;transform:scale(1.08)}
  .pin-dot.error{background:#ff6b6b;border-color:#ff6b6b}
  .pin-pad{display:grid; grid-template-columns:repeat(3,1fr); gap:10px; width:100%}
  .pin-key{
    height:60px; border-radius:14px;
    background:rgba(255,255,255,.06);
    border:1px solid rgba(255,255,255,.1);
    font-family:var(--mono); font-size:21px; font-weight:500; color:#fff;
    cursor:pointer; display:flex; align-items:center; justify-content:center;
    transition:background .1s,transform .1s;
  }
  .pin-key:active{background:rgba(255,255,255,.15); transform:scale(.95)}
  .pin-key.del{font-size:16px; color:rgba(255,255,255,.65)}
  .pin-key.empty{background:none;border:none;cursor:default}
  .pin-error-msg{font-family:var(--mono);font-size:12px;color:#ff7d7d;display:none;text-align:center}

  @keyframes shake {
    0%, 100% { transform: translateX(0); }
    20%, 60% { transform: translateX(-6px); }
    40%, 80% { transform: translateX(6px); }
  }
  .shake {
    animation: shake 0.35s ease-in-out;
  }
</style>
</head>
<body>

<div id="pin-screen">
  <div class="pin-box" id="pin-box">
    <div class="pin-logo">
      <div class="pin-logo-icon">🗒</div>
      <div class="pin-title">Comandero 2.7</div>
    </div>
    <div class="pin-sub" id="pin-sub">Introduce tu PIN</div>
    <div class="pin-dots">
      <div class="pin-dot" id="pd0"></div>
      <div class="pin-dot" id="pd1"></div>
      <div class="pin-dot" id="pd2"></div>
      <div class="pin-dot" id="pd3"></div>
    </div>
    <div class="pin-error-msg" id="pin-error">PIN incorrecto</div>
    <div class="pin-pad" id="pin-pad">
      <button class="pin-key" data-k="1">1</button>
      <button class="pin-key" data-k="2">2</button>
      <button class="pin-key" data-k="3">3</button>
      <button class="pin-key" data-k="4">4</button>
      <button class="pin-key" data-k="5">5</button>
      <button class="pin-key" data-k="6">6</button>
      <button class="pin-key" data-k="7">7</button>
      <button class="pin-key" data-k="8">8</button>
      <button class="pin-key" data-k="9">9</button>
      <button class="pin-key empty" data-k=""></button>
      <button class="pin-key" data-k="0">0</button>
      <button class="pin-key del" data-k="del">DEL</button>
    </div>
  </div>
</div>

<script type="module" src="camarero.js"></script>
</body>
</html>
